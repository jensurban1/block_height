<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3ef; --surface: #fff; --border: #e0ddd6; --border-light: #ece9e2;
  --text: #1a1916; --text-sub: #6b6860; --text-hint: #a09e98;
  --accent: #2d5be3; --accent-bg: #eef2fd; --accent-text: #1a3fa0;
  --danger: #c0392b; --warn: #b45309; --warn-bg: #fef3c7;
  --success: #1a7a4a; --success-bg: #eaf5ee;
}
html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }

/* ── 헤더 ── */
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; position: relative; z-index: 200;
}
header h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.02em; }
header span { font-size: 10px; color: var(--text-hint); font-family: 'DM Mono', monospace; margin-left: 8px; }
.add-btn { font-size: 11px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--accent); background: var(--accent-bg); border: none; border-radius: 5px; padding: 5px 12px; cursor: pointer; }
.add-btn:hover { opacity: 0.8; }

/* ── 전체 요약 바 (헤더 바로 아래 고정) ── */
.summary-bar {
  background: var(--surface); border-bottom: 2px solid var(--accent);
  padding: 0 20px; height: 48px;
  display: flex; align-items: center; gap: 32px;
  flex-shrink: 0; position: relative; z-index: 100;
}
.summary-item { display: flex; align-items: baseline; gap: 6px; }
.summary-label { font-size: 10px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; }
.summary-value { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
.summary-unit { font-size: 11px; color: var(--text-hint); }
.summary-divider { width: 1px; height: 24px; background: var(--border); }

/* ── 메인: 좌(지도) + 우(구역목록) ── */
.main {
  display: grid;
  grid-template-columns: 1fr 2fr; /* 지도 1/3, 구역목록 2/3 */
  height: calc(100vh - 44px - 48px);
  overflow: hidden;
}

/* ── 좌측: 지도 패널 ── */
.map-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
#shared-map { flex: 1; min-height: 0; }
.map-toolbar {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 8px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
.tool-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; white-space: nowrap; }
.tool-btn:hover { background: var(--bg); }
.tool-btn.active { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tool-btn.layer-on { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }
.map-badge { font-size: 10px; color: var(--text-hint); font-family: 'DM Mono', monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.measure-bar { font-size: 10px; color: var(--warn); font-family: 'DM Mono', monospace; display: none; width: 100%; padding-top: 2px; }
.measure-bar.show { display: block; }

/* ── 우측: 구역 목록 ── */
.blocks-panel { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.blocks-scroll { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

/* ── 구역 카드 ── */
.block-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bc-head { display: flex; align-items: center; gap: 5px; padding: 6px 10px; background: #faf9f7; border-bottom: 1px solid var(--border-light); }
.bc-num { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-hint); background: var(--border-light); border-radius: 2px; padding: 1px 5px; flex-shrink: 0; }
.bc-name { font-size: 11px; font-weight: 500; border: none; background: transparent; color: var(--text); outline: none; flex: 1; min-width: 0; font-family: 'Noto Sans KR', sans-serif; }
.bc-name::placeholder { color: var(--text-hint); }
.bc-del { font-size: 9px; color: var(--text-hint); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 2px 5px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0; }
.bc-del:hover { color: var(--danger); border-color: var(--danger); }

/* 카드 바디: 좌(주소+링크+변환) + 우(입력+결과) 2단 */
.bc-body { display: grid; grid-template-columns: 160px 1fr; }
.bc-left { padding: 8px 10px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 5px; }
.bc-right { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }

/* 주소 */
.bc-addr-row { display: flex; align-items: center; gap: 4px; }
.bc-addr { font-size: 10px; color: var(--text-sub); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc-addr.empty { color: var(--text-hint); }
.bc-search { font-size: 9px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--accent); border: none; border-radius: 3px; padding: 3px 7px; cursor: pointer; flex-shrink: 0; }
.bc-links { display: flex; gap: 3px; flex-wrap: wrap; }
.bc-link { font-size: 9px; font-family: 'Noto Sans KR', sans-serif; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; text-decoration: none; white-space: nowrap; }
.bc-link:hover { background: var(--bg); }

/* 지번→도로명 변환 */
.bc-conv-row { display: flex; gap: 3px; }
.bc-conv-in { flex: 1; font-size: 9px; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 3px 5px; outline: none; min-width: 0; color: var(--text); }
.bc-conv-in:focus { border-color: var(--accent); background: var(--surface); }
.bc-conv-btn { font-size: 9px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--text-sub); border: none; border-radius: 3px; padding: 3px 6px; cursor: pointer; white-space: nowrap; }
.bc-conv-res { font-size: 9px; line-height: 1.4; padding: 3px 5px; border-radius: 3px; word-break: break-all; display: none; }
.bc-conv-res.ok { background: var(--success-bg); color: var(--success); display: block; }
.bc-conv-res.err { background: var(--warn-bg); color: var(--warn); display: block; }
.bc-conv-copy { font-size: 9px; font-family: 'Noto Sans KR', sans-serif; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; width: 100%; display: none; margin-top: 2px; }
.bc-conv-copy.show { display: block; }

/* ── 우측 입력 (컴팩트) ── */
.bc-sec { font-size: 8px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); display: flex; align-items: center; gap: 3px; margin-top: 2px; }
.bc-sec::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

/* 인라인 그리드 — 공통(3칸), 단변(4칸), 장변(4칸) 모두 한 줄로 */
.bc-row { display: grid; gap: 4px; align-items: end; }
.bc-row.r3 { grid-template-columns: repeat(3, 1fr); }
.bc-row.r4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.bc-row.r5 { grid-template-columns: 1fr 1fr 1fr 1fr 1fr; }

.bc-field { display: flex; flex-direction: column; gap: 1px; }
.bc-field label { font-size: 8px; color: var(--text-hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-field input, .bc-field select {
  font-family: 'Noto Sans KR', sans-serif; font-size: 10px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 4px; outline: none; width: 100%;
}
.bc-field input:focus, .bc-field select:focus { border-color: var(--accent); background: var(--surface); }
.bc-field input[readonly] { background: #f5f4f0 !important; color: var(--text-sub); }

/* 결과 — 6칸 한 줄 */
.bc-results { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 3px; padding-top: 4px; border-top: 1px solid var(--border-light); }
.bc-metric { background: var(--bg); border-radius: 3px; padding: 3px 4px; }
.bc-metric-label { font-size: 7px; color: var(--text-hint); margin-bottom: 1px; }
.bc-metric-value { font-size: 11px; font-weight: 600; font-family: 'DM Mono', monospace; }
.bc-metric-value.hi { color: var(--accent); }
.bc-metric-unit { font-size: 7px; color: var(--text-hint); }

.bcr-wrap { display: none; }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div style="display:flex;align-items:center;">
    <h1>블록별 최고높이 검토</h1>
    <span>도로사선 기반 · 지구단위계획</span>
  </div>
  <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
</header>

<!-- 전체 요약 바 (항상 최상단 노출) -->
<div class="summary-bar">
  <div class="summary-item">
    <span class="summary-label">블록평균높이</span>
    <span class="summary-value" id="avg-height">—</span>
    <span class="summary-unit">m</span>
  </div>
  <div class="summary-divider"></div>
  <div class="summary-item">
    <span class="summary-label">총 체적</span>
    <span class="summary-value" id="sum-vol" style="font-size:15px;">—</span>
    <span class="summary-unit">㎡</span>
  </div>
  <div class="summary-divider"></div>
  <div class="summary-item">
    <span class="summary-label">구역 수</span>
    <span class="summary-value" id="block-count" style="font-size:15px;">0</span>
    <span class="summary-unit">개</span>
  </div>
</div>

<!-- 메인 -->
<div class="main">

  <!-- 좌측: 지도 -->
  <div class="map-panel">
    <div id="shared-map"></div>
    <div class="map-toolbar">
      <button class="tool-btn layer-on" id="cadastral-btn">지적도 ON</button>
      <button class="tool-btn" id="measure-btn">거리재기</button>
      <button class="tool-btn" id="reset-btn">초기화</button>
      <span class="map-badge" id="map-badge">주소 검색 시 지도 이동</span>
      <div class="measure-bar" id="measure-bar"></div>
    </div>
  </div>

  <!-- 우측: 구역 목록 -->
  <div class="blocks-panel">
    <div class="blocks-scroll" id="blocks-container"></div>
  </div>

</div>

<script>
var VKEY     = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
var JUSO_KEY = 'U01TX0FVVEgyMDI2MDQwNzE0MzkwODExNzg2NTc=';
var blockCount = 0, blocks = [], pnuStore = {};

// ── 공유 지도 초기화 ──────────────────────────────────
var sharedMap = L.map('shared-map', { center: [37.5665, 126.9780], zoom: 12 });

L.tileLayer(
  'https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/Base/{z}/{y}/{x}.png',
  { attribution: '© VWorld', maxZoom: 19 }
).addTo(sharedMap);

var cadastralLayer = L.tileLayer.wms('https://api.vworld.kr/req/wms', {
  layers: 'lt_c_landinfobasemap',
  styles: '', format: 'image/png', transparent: true,
  version: '1.3.0', key: VKEY, maxZoom: 19
}).addTo(sharedMap);

var cadastralOn = true;
var currentMarker = null;
var ms = { on: false, points: [], dots: [], polyline: null, preview: null, clickFn: null, moveFn: null, ctxFn: null };

// [3번 수정] ResizeObserver로 지도 컨테이너 크기 변화 감지 → invalidateSize 자동 호출
// 화면 크기 변경, 레이아웃 변경 등 모든 상황에 대응
var mapContainer = document.getElementById('shared-map');
var resizeObserver = new ResizeObserver(function() {
  if (sharedMap) {
    sharedMap.invalidateSize({ animate: false });
  }
});
resizeObserver.observe(mapContainer);

// 지적도 토글
document.getElementById('cadastral-btn').onclick = function() {
  if (cadastralOn) {
    sharedMap.removeLayer(cadastralLayer); cadastralOn = false;
    this.classList.remove('layer-on'); this.textContent = '지적도';
  } else {
    cadastralLayer.addTo(sharedMap); cadastralOn = true;
    this.classList.add('layer-on'); this.textContent = '지적도 ON';
  }
};

// 거리재기 종료
function stopMeasure() {
  if (!ms.on) return;
  ms.on = false;
  var btn = document.getElementById('measure-btn');
  btn.classList.remove('active'); btn.textContent = '거리재기';
  sharedMap.off('click', ms.clickFn);
  sharedMap.off('mousemove', ms.moveFn);
  if (ms.ctxFn) sharedMap.getContainer().removeEventListener('contextmenu', ms.ctxFn);
  sharedMap.getContainer().style.cursor = '';
  if (ms.preview) { sharedMap.removeLayer(ms.preview); ms.preview = null; }
}

document.getElementById('measure-btn').onclick = function() {
  var res = document.getElementById('measure-bar');
  if (ms.on) {
    stopMeasure();
  } else {
    clearMeasure();
    ms.on = true; this.classList.add('active'); this.textContent = '측정 종료';
    res.className = 'measure-bar';
    sharedMap.getContainer().style.cursor = 'crosshair';

    ms.clickFn = function(e) {
      ms.points.push(e.latlng);
      var dot = L.circleMarker(e.latlng, { radius: 4, color: '#b45309', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(sharedMap);
      ms.dots.push(dot);
      if (ms.polyline) sharedMap.removeLayer(ms.polyline);
      if (ms.points.length >= 2) {
        ms.polyline = L.polyline(ms.points, { color: '#b45309', weight: 2.5, opacity: 1 }).addTo(sharedMap);
        var dist = 0;
        for (var i = 1; i < ms.points.length; i++) dist += ms.points[i-1].distanceTo(ms.points[i]);
        res.className = 'measure-bar show';
        res.textContent = '총 ' + dist.toFixed(1) + ' m · ' + (ms.points.length - 1) + '구간  (우클릭: 종료)';
      }
    };
    ms.moveFn = function(e) {
      if (ms.points.length === 0) return;
      var last = ms.points[ms.points.length - 1];
      if (ms.preview) sharedMap.removeLayer(ms.preview);
      ms.preview = L.polyline([last, e.latlng], { color: '#b45309', weight: 1.5, opacity: 0.45, dashArray: '6 4' }).addTo(sharedMap);
    };
    ms.ctxFn = function(e) { e.preventDefault(); stopMeasure(); };
    sharedMap.on('click', ms.clickFn);
    sharedMap.on('mousemove', ms.moveFn);
    sharedMap.getContainer().addEventListener('contextmenu', ms.ctxFn);
  }
};

document.getElementById('reset-btn').onclick = function() {
  stopMeasure(); clearMeasure();
  document.getElementById('measure-bar').className = 'measure-bar';
};

function clearMeasure() {
  if (ms.polyline) { sharedMap.removeLayer(ms.polyline); ms.polyline = null; }
  if (ms.preview)  { sharedMap.removeLayer(ms.preview);  ms.preview = null; }
  ms.dots.forEach(function(d) { sharedMap.removeLayer(d); });
  ms.dots = []; ms.points = [];
}

function moveMap(lat, lng, label) {
  sharedMap.setView([lat, lng], 17);
  if (currentMarker) sharedMap.removeLayer(currentMarker);
  currentMarker = L.marker([lat, lng]).addTo(sharedMap);
  currentMarker.bindPopup('<div style="font-size:11px;">' + label + '</div>').openPopup();
  document.getElementById('map-badge').textContent = label;
}

// ── 행안부 API ────────────────────────────────────────
function jusoSearch(kw, cb) {
  fetch('https://business.juso.go.kr/addrlink/addrLinkApi.do'
    + '?confmKey=' + JUSO_KEY + '&currentPage=1&countPerPage=1'
    + '&keyword=' + encodeURIComponent(kw) + '&resultType=json&addInfoYn=N')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var list = d && d.results && d.results.juso;
      cb(list && list.length > 0 ? list[0] : null);
    })
    .catch(function() { cb(null); });
}

// ── Nominatim ─────────────────────────────────────────
function nomGeo(query, zip, cb) {
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=3&countrycodes=kr&addressdetails=1&q='
    + encodeURIComponent('대한민국 ' + query);
  if (zip) url += '&postalcode=' + zip;
  fetch(url, { headers: { 'Accept-Language': 'ko' } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var kr = (d || []).filter(function(x) { return x.address && x.address.country_code === 'kr'; });
      var best = kr[0] || (d && d[0]);
      cb(best ? parseFloat(best.lat) : null, best ? parseFloat(best.lon) : null);
    })
    .catch(function() { cb(null, null); });
}

function resolveAddr(road, jibun, blockId, onOk, onFail) {
  jusoSearch(road || jibun, function(juso) {
    if (juso && juso.admCd) {
      pnuStore[blockId] = juso.admCd + juso.mtYn
        + String(juso.lnbrMnnm).padStart(4,'0')
        + String(juso.lnbrSlno).padStart(4,'0');
    }
    var geoAddr = (juso && juso.roadAddrPart1) || road || jibun;
    var zip = (juso && juso.zipNo) || '';
    nomGeo(geoAddr, zip, function(la, lo) {
      if (la && lo) { onOk(la, lo); return; }
      nomGeo(jibun, zip, function(la2, lo2) {
        if (la2 && lo2) { onOk(la2, lo2); return; }
        nomGeo((road||jibun).split(' ').slice(0,3).join(' '), '', function(la3, lo3) {
          if (la3 && lo3) onOk(la3, lo3); else onFail();
        });
      });
    });
  });
}

// ── 토지이음 필지 이동 ────────────────────────────────
function openEum(id) {
  var pnu = pnuStore[id] || '';
  var f = document.createElement('form');
  f.method = 'post'; f.action = 'https://www.eum.go.kr/web/ar/lu/luLandDet.jsp'; f.target = '_blank';
  var inp = document.createElement('input'); inp.type='hidden'; inp.name='pnu'; inp.value=pnu;
  f.appendChild(inp); document.body.appendChild(f); f.submit(); document.body.removeChild(f);
}

// ── 주소 검색 ─────────────────────────────────────────
function openSearch(id) {
  new daum.Postcode({
    oncomplete: function(data) {
      var road  = data.roadAddress || '';
      var jibun = data.jibunAddress || data.autoJibunAddress || '';
      var display = jibun || road;

      var addrEl = document.getElementById('bc-addr-' + id);
      if (addrEl) { addrEl.textContent = display; addrEl.classList.remove('empty'); }

      var nm = document.getElementById('bc-name-' + id);
      if (nm && !nm.value) nm.value = (data.bname||'') + ' ' + (data.jibun||'');

      var copyBtn = document.getElementById('bc-copy-' + id);
      if (copyBtn) copyBtn.dataset.addr = display;

      document.getElementById('map-badge').textContent = '검색 중...';
      resolveAddr(road, jibun, id,
        function(la, lo) { moveMap(la, lo, (data.bname||'') + ' ' + (data.jibun||'')); },
        function() { document.getElementById('map-badge').textContent = '좌표 검색 실패 — ' + display; }
      );
    }
  }).open();
}

// ── 지번→도로명 ───────────────────────────────────────
function runConvert(id) {
  var input  = document.getElementById('bc-conv-in-' + id);
  var result = document.getElementById('bc-conv-res-' + id);
  var cpBtn  = document.getElementById('bc-conv-cp-' + id);
  var q = input && input.value.trim();
  if (!q) return;
  result.className = 'bc-conv-res'; result.textContent = '변환 중...'; result.style.display = 'block';
  cpBtn.className = 'bc-conv-copy';
  jusoSearch(q, function(juso) {
    if (juso && juso.roadAddr) {
      var addr = juso.roadAddr;
      result.className = 'bc-conv-res ok'; result.textContent = addr;
      cpBtn.className = 'bc-conv-copy show';
      cpBtn.onclick = function() {
        navigator.clipboard.writeText(addr).then(function() {
          cpBtn.textContent = '복사됨 ✓'; setTimeout(function() { cpBtn.textContent = '도로명 복사'; }, 1500);
        });
      };
    } else {
      result.className = 'bc-conv-res err'; result.textContent = '검색 결과 없음';
    }
  });
}

function copyAddr(id) {
  var btn = document.getElementById('bc-copy-' + id);
  var addr = (btn && btn.dataset.addr) || '';
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(function() {
    btn.textContent = '복사됨 ✓'; setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  });
}

// ── 용도지역 ─────────────────────────────────────────
var ZONE_BCR = {
  '50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,
  '60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,
  '60_ie':60,'60_ig':60,'60_is':60,
  '20_gb':20,'20_gp':20,'20_gn':20
};
function applyZone(id) {
  var sel = document.getElementById('bc-zone-' + id);
  var wrap = document.getElementById('bc-bcr-wrap-' + id);
  if (!sel) return;
  if (sel.value === 'custom') { if (wrap) wrap.style.display = 'block'; return; }
  if (wrap) wrap.style.display = 'none';
  var bcr = ZONE_BCR[sel.value];
  if (bcr !== undefined) { document.getElementById('bc-bcr-' + id).value = bcr; calc(id); }
}
function applyCustom(id) {
  var val = parseFloat(document.getElementById('bc-bcr-custom-' + id).value) || 0;
  document.getElementById('bc-bcr-' + id).value = val; calc(id);
}

// ── 구역 카드 ─────────────────────────────────────────
function addBlock() {
  blockCount++; var id = blockCount; blocks.push(id);
  var div = document.createElement('div');
  div.className = 'block-card'; div.id = 'block-' + id;

  div.innerHTML =
    '<div class="bc-head">'
      + '<span class="bc-num">' + String(id).padStart(2,'0') + '</span>'
      + '<input class="bc-name" type="text" placeholder="구역명" id="bc-name-' + id + '">'
      + '<button class="bc-del" onclick="removeBlock(' + id + ')">✕</button>'
    + '</div>'
    + '<div class="bc-body">'

      // 좌측: 주소 + 링크 + 변환
      + '<div class="bc-left">'
        + '<div class="bc-addr-row">'
          + '<span class="bc-addr empty" id="bc-addr-' + id + '">주소 미설정</span>'
          + '<button class="bc-search" onclick="openSearch(' + id + ')">검색</button>'
        + '</div>'
        + '<div class="bc-links">'
          + '<button class="bc-link" id="bc-copy-' + id + '" onclick="copyAddr(' + id + ')">주소 복사</button>'
          + '<a class="bc-link" href="https://www.eum.go.kr/web/am/amMain.jsp" target="_blank">토지이음 ↗</a>'
          + '<a class="bc-link" href="https://urban.seoul.go.kr/view/map/main.html" target="_blank">서울도시공간포털 ↗</a>'
        + '</div>'
        + '<div class="bc-conv-row">'
          + '<input class="bc-conv-in" type="text" id="bc-conv-in-' + id + '" placeholder="지번 → 도로명"'
          + ' onkeydown="if(event.key===\'Enter\')runConvert(' + id + ')">'
          + '<button class="bc-conv-btn" onclick="runConvert(' + id + ')">변환</button>'
        + '</div>'
        + '<div class="bc-conv-res" id="bc-conv-res-' + id + '"></div>'
        + '<button class="bc-conv-copy" id="bc-conv-cp-' + id + '">도로명 복사</button>'
      + '</div>'

      // 우측: 입력 + 결과 (컴팩트)
      + '<div class="bc-right">'
        + '<input type="hidden" id="bc-bcr-' + id + '" value="60">'

        // 공통: 대지면적 + 용도지역 + 후면후퇴 한 줄
        + '<div class="bc-sec">공통</div>'
        + '<div class="bc-row r3">'
          + '<div class="bc-field"><label>대지면적(㎡)</label><input type="number" id="bc-area-' + id + '" placeholder="입력" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>용도지역</label>'
            + '<select id="bc-zone-' + id + '" onchange="applyZone(' + id + ')">'
              + '<option value="">— 선택 —</option>'
              + '<option value="50">1종전용(50%)</option><option value="40">2종전용(40%)</option>'
              + '<option value="60_1">1종일반(60%)</option><option value="60_2">2종일반(60%)</option>'
              + '<option value="50_3">3종일반(50%)</option><option value="60_j">준주거(60%)</option>'
              + '<option value="60_cs">중심상업(60%)</option><option value="60_cg">일반상업(60%)</option>'
              + '<option value="60_cn">근린상업(60%)</option><option value="60_cd">유통상업(60%)</option>'
              + '<option value="60_ie">전용공업(60%)</option><option value="60_ig">일반공업(60%)</option>'
              + '<option value="60_is">준공업(60%)</option>'
              + '<option value="20_gb">보전녹지(20%)</option><option value="20_gp">생산녹지(20%)</option>'
              + '<option value="20_gn">자연녹지(20%)</option><option value="custom">직접입력</option>'
            + '</select>'
            + '<div class="bcr-wrap" id="bc-bcr-wrap-' + id + '"><input type="number" id="bc-bcr-custom-' + id + '" placeholder="건폐율%" oninput="applyCustom(' + id + ')"></div>'
          + '</div>'
          + '<div class="bc-field"><label>후면후퇴(m)</label><input type="number" id="bc-rear-' + id + '" value="0" oninput="calc(' + id + ')"></div>'
        + '</div>'

        + '<div class="bc-sec">단변</div>'
        + '<div class="bc-row r4">'
          + '<div class="bc-field"><label>전면도로폭(m)</label><input type="number" id="bc-rs-' + id + '" placeholder="50" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>전면후퇴(m)</label><input type="number" id="bc-fs-' + id + '" value="3" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>획지폭(m)</label><input type="number" id="bc-ws-' + id + '" placeholder="24.6" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>획지깊이(자동)</label><input type="number" id="bc-ds-' + id + '" readonly></div>'

        + '<div class="bc-sec">장변</div>'
        + '<div class="bc-row r4">'
          + '<div class="bc-field"><label>전면도로폭(m)</label><input type="number" id="bc-rl-' + id + '" placeholder="50" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>전면후퇴(m)</label><input type="number" id="bc-fl-' + id + '" value="3" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>획지폭(m)</label><input type="number" id="bc-wl-' + id + '" placeholder="62" oninput="calc(' + id + ')"></div>'
          + '<div class="bc-field"><label>획지깊이(자동)</label><input type="number" id="bc-dl-' + id + '" readonly></div>'
        + '</div>'

        // 결과
        + '<div class="bc-results">'
          + '<div class="bc-metric"><div class="bc-metric-label">최저점</div><div class="bc-metric-value" id="bc-rmin-' + id + '">—</div></div>'
          + '<div class="bc-metric"><div class="bc-metric-label">최고점</div><div class="bc-metric-value" id="bc-rmax-' + id + '">—</div></div>'
          + '<div class="bc-metric"><div class="bc-metric-label">평균점</div><div class="bc-metric-value" id="bc-ravg-' + id + '">—</div></div>'
          + '<div class="bc-metric"><div class="bc-metric-label">최솟값</div><div class="bc-metric-value hi" id="bc-rval-' + id + '">—</div></div>'
          + '<div class="bc-metric"><div class="bc-metric-label">바닥면적</div><div class="bc-metric-value" id="bc-rfloor-' + id + '">—</div></div>'
          + '<div class="bc-metric"><div class="bc-metric-label">체적</div><div class="bc-metric-value" id="bc-rvol-' + id + '">—</div></div>'
        + '</div>'
      + '</div>'
    + '</div>';

  document.getElementById('blocks-container').appendChild(div);
  updateSummary();
}

function removeBlock(id) {
  blocks = blocks.filter(function(b) { return b !== id; });
  delete pnuStore[id];
  var el = document.getElementById('block-' + id); if (el) el.remove();
  updateSummary();
}

// ── 계산 ─────────────────────────────────────────────
function g(eid) { var el = document.getElementById(eid); return el ? parseFloat(el.value) || 0 : 0; }

function side(road, front, width, rear) {
  var d = width - front;
  var mn = (road + front) * 1.5;
  var mx = (road + front + d - rear) * 1.5;
  return { d: d, mn: mn, mx: mx, avg: (mn + mx) / 2 };
}

function calc(id) {
  var area = g('bc-area-'+id), bcr = g('bc-bcr-'+id)/100, rear = g('bc-rear-'+id);
  var rs = side(g('bc-rs-'+id), g('bc-fs-'+id), g('bc-ws-'+id), rear);
  var rl = side(g('bc-rl-'+id), g('bc-fl-'+id), g('bc-wl-'+id), rear);

  var ds = document.getElementById('bc-ds-'+id);
  var dl = document.getElementById('bc-dl-'+id);
  if (ds) ds.value = rs.d > 0 ? rs.d.toFixed(1) : '';
  if (dl) dl.value = rl.d > 0 ? rl.d.toFixed(1) : '';

  var hasL = g('bc-rl-'+id) > 0 || g('bc-wl-'+id) > 0;
  var minV, dMn, dMx, dAv;
  if (hasL && rl.avg > 0) {
    minV = Math.min(rs.avg, rl.avg);
    dMn = Math.min(rs.mn, rl.mn); dMx = Math.max(rs.mx, rl.mx); dAv = (rs.avg + rl.avg) / 2;
  } else {
    minV = rs.avg; dMn = rs.mn; dMx = rs.mx; dAv = rs.avg;
  }

  var floor = area * bcr, vol = floor * minV;
  var f1 = function(n) { return n > 0 ? n.toFixed(1) : '—'; };
  var f0 = function(n) { return n > 0 ? Math.round(n).toLocaleString() : '—'; };
  var u  = function(s) { return '<span class="bc-metric-unit">' + s + '</span>'; };

  document.getElementById('bc-rmin-'+id).innerHTML  = f1(dMn)  + (dMn  > 0 ? u('m')  : '');
  document.getElementById('bc-rmax-'+id).innerHTML  = f1(dMx)  + (dMx  > 0 ? u('m')  : '');
  document.getElementById('bc-ravg-'+id).innerHTML  = f1(dAv)  + (dAv  > 0 ? u('m')  : '');
  document.getElementById('bc-rval-'+id).innerHTML  = f1(minV) + (minV > 0 ? u('m')  : '');
  document.getElementById('bc-rfloor-'+id).innerHTML= f1(floor)+ (floor> 0 ? u('㎡') : '');
  document.getElementById('bc-rvol-'+id).innerHTML  = f0(vol)  + (vol  > 0 ? u('㎡') : '');
  updateSummary();
}

function updateSummary() {
  var tF = 0, tV = 0, ok = false;
  blocks.forEach(function(id) {
    var area = g('bc-area-'+id), bcr = g('bc-bcr-'+id)/100, rear = g('bc-rear-'+id);
    var rs = side(g('bc-rs-'+id), g('bc-fs-'+id), g('bc-ws-'+id), rear);
    var rl = side(g('bc-rl-'+id), g('bc-fl-'+id), g('bc-wl-'+id), rear);
    var hasL = g('bc-rl-'+id) > 0 || g('bc-wl-'+id) > 0;
    var minV = (hasL && rl.avg > 0) ? Math.min(rs.avg, rl.avg) : rs.avg;
    var floor = area * bcr, vol = floor * minV;
    if (area > 0 && minV > 0) { tF += floor; tV += vol; ok = true; }
  });
  var avgH = tF > 0 ? tV / tF : 0;
  document.getElementById('avg-height').textContent = ok ? avgH.toFixed(1) : '—';
  document.getElementById('sum-vol').textContent = ok ? Math.round(tV).toLocaleString() : '—';
  document.getElementById('block-count').textContent = blocks.length;
}

addBlock();
</script>
