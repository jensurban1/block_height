<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3ef; --surface: #fff; --border: #e0ddd6; --border-light: #ece9e2;
  --text: #1a1916; --text-sub: #6b6860; --text-hint: #a09e98;
  --accent: #2d5be3; --accent-bg: #eef2fd; --accent-text: #1a3fa0;
  --danger: #c0392b; --warn: #b45309; --warn-bg: #fef3c7;
  --success: #1a7a4a; --success-bg: #eaf5ee;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
header span { font-size: 11px; color: var(--text-hint); font-family: 'DM Mono', monospace; }
.add-btn { font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--accent); background: var(--accent-bg); border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.add-btn:hover { opacity: 0.8; }

.layout { display: grid; grid-template-columns: 1fr 280px; min-height: calc(100vh - 53px); }
.blocks-col { padding: 20px; border-right: 1px solid var(--border); overflow-y: auto; }
.summary-col { padding: 20px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow-y: auto; }

.block-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.block-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #faf9f7; border-bottom: 1px solid var(--border-light); }
.block-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-hint); background: var(--border-light); border-radius: 3px; padding: 2px 7px; margin-right: 8px; }
.block-name-input { font-size: 13px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; border: none; background: transparent; color: var(--text); outline: none; flex: 1; }
.block-name-input::placeholder { color: var(--text-hint); }
.remove-btn { font-size: 11px; color: var(--text-hint); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.remove-btn:hover { color: var(--danger); border-color: var(--danger); }

.block-body { display: grid; grid-template-columns: 200px 1fr 300px; align-items: stretch; }
.col-addr { padding: 14px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; }
.col-inputs { padding: 14px; border-right: 1px solid var(--border-light); }
.col-map { display: flex; flex-direction: column; }

.addr-label { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 6px; }
.addr-display { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; min-height: 32px; line-height: 1.5; }
.addr-btn { width: 100%; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--accent); border: none; border-radius: 6px; padding: 7px; cursor: pointer; margin-bottom: 6px; }
.addr-btn:hover { opacity: 0.85; }
.ext-btns { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.ext-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; text-decoration: none; text-align: center; display: none; }
.ext-btn:hover { background: var(--bg); }
.ext-btn.show, .copy-btn.show { display: block; }

.converter-wrap { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: auto; }
.converter-label { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 6px; }
.converter-input-row { display: flex; gap: 4px; margin-bottom: 5px; }
.converter-input { flex: 1; font-size: 11px; font-family: 'Noto Sans KR', sans-serif; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; outline: none; min-width: 0; }
.converter-input:focus { border-color: var(--accent); }
.converter-btn { font-size: 11px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--text-sub); border: none; border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; }
.converter-btn:hover { background: var(--text); }
.converter-result { font-size: 10px; line-height: 1.5; padding: 6px 8px; border-radius: 5px; word-break: break-all; display: none; }
.converter-result.ok  { background: var(--success-bg); color: var(--success); display: block; }
.converter-result.err { background: var(--warn-bg); color: var(--warn); display: block; }
.converter-copy { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; margin-top: 4px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; width: 100%; display: none; }
.converter-copy.show { display: block; }
.converter-copy:hover { background: var(--bg); }

.inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.inputs-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.input-field { display: flex; flex-direction: column; gap: 3px; }
.input-field label { font-size: 10px; color: var(--text-sub); }
input[type="number"], select { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; outline: none; width: 100%; transition: border-color 0.15s; }
input[type="number"]:focus, select:focus { border-color: var(--accent); }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); margin: 6px 0; display: flex; align-items: center; gap: 6px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

.result-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-light); }
.metric { background: var(--bg); border-radius: 6px; padding: 7px 8px; }
.metric-label { font-size: 9px; color: var(--text-hint); margin-bottom: 2px; }
.metric-value { font-size: 14px; font-weight: 600; font-family: 'DM Mono', monospace; }
.metric-value.hi { color: var(--accent); }
.metric-unit { font-size: 9px; color: var(--text-hint); }

.map-wrap { flex: 1; }
.map-placeholder { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-hint); text-align: center; line-height: 1.8; background: var(--bg); height: 280px; }
.map-tools { display: flex; gap: 5px; padding: 6px 8px; background: var(--surface); border-top: 1px solid var(--border-light); flex-wrap: wrap; }
.tool-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; }
.tool-btn.active { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tool-btn.layer-on { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }
.measure-result { font-size: 10px; color: var(--warn); padding: 0 8px 6px; display: none; font-family: 'DM Mono', monospace; }
.measure-result.show { display: block; }

.summary-title { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 14px; }
.summary-block-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.summary-block-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.summary-block-name { font-size: 12px; font-weight: 500; margin-bottom: 6px; }
.summary-block-vals { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.sval { font-size: 10px; color: var(--text-sub); }
.sval span { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--text); }
.summary-total { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.total-label { font-size: 10px; color: var(--text-sub); margin-bottom: 3px; }
.total-value { font-size: 22px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
.total-unit { font-size: 11px; color: var(--text-hint); }
.divider-line { border: none; border-top: 1px solid var(--border-light); margin: 12px 0; }
.bcr-custom-wrap { display: none; margin-top: 4px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .summary-col { position: static; height: auto; border-top: 1px solid var(--border); }
  .block-body { grid-template-columns: 1fr; }
  .col-addr, .col-inputs { border-right: none; border-bottom: 1px solid var(--border-light); }
  .result-strip { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <h1>블록별 최고높이 검토</h1>
    <span>도로사선 기반 · 지구단위계획</span>
  </div>
  <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
</header>

<div class="layout">
  <div class="blocks-col" id="blocks-container"></div>
  <div class="summary-col">
    <div class="summary-title">전체 요약</div>
    <div class="summary-block-list" id="summary-list"></div>
    <hr class="divider-line">
    <div class="summary-total">
      <div class="total-label">블록평균높이</div>
      <div><span class="total-value" id="avg-height">—</span> <span class="total-unit">m</span></div>
      <div style="margin-top:10px;">
        <div class="total-label">총 체적</div>
        <div style="font-size:14px;font-weight:600;font-family:'DM Mono',monospace;" id="sum-vol">—</div>
      </div>
    </div>
  </div>
</div>

<script>
var VKEY     = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
var JUSO_KEY = 'U01TX0FVVEgyMDI2MDQwNzE0MzkwODExNzg2NTc=';
var blockCount = 0, blocks = [], mapObjs = {}, measureState = {};
var MAP_H = 280;

// ── 행안부 주소검색 API ───────────────────────────────
function jusoSearch(keyword, callback) {
  var url = 'https://business.juso.go.kr/addrlink/addrLinkApi.do'
    + '?confmKey=' + JUSO_KEY
    + '&currentPage=1&countPerPage=1'
    + '&keyword=' + encodeURIComponent(keyword)
    + '&resultType=json&addInfoYn=N';
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var list = d && d.results && d.results.juso;
      if (list && list.length > 0) callback(list[0], null);
      else callback(null, '검색 결과가 없습니다.');
    })
    .catch(function(e) { callback(null, e.message); });
}

// ── Nominatim Geocoding ───────────────────────────────
function nominatimGeocode(query, callback) {
  var url = 'https://nominatim.openstreetmap.org/search'
    + '?format=json&limit=3&countrycodes=kr&addressdetails=1'
    + '&q=' + encodeURIComponent('대한민국 ' + query);
  fetch(url, { headers: { 'Accept-Language': 'ko' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var kr = (data || []).filter(function(r) { return r.address && r.address.country_code === 'kr'; });
      var best = kr.length > 0 ? kr[0] : (data && data[0]);
      if (best) callback(parseFloat(best.lat), parseFloat(best.lon));
      else callback(null, null);
    })
    .catch(function() { callback(null, null); });
}

function geocode(road, jibun, onSuccess, onFail) {
  jusoSearch(road || jibun, function(juso, err) {
    var roadAddr = (juso && juso.roadAddrPart1) || road;
    nominatimGeocode(roadAddr, function(lat, lng) {
      if (lat && lng) { onSuccess(lat, lng); return; }
      nominatimGeocode(jibun, function(lat2, lng2) {
        if (lat2 && lng2) { onSuccess(lat2, lng2); return; }
        var rough = (road || jibun).split(' ').slice(0, 3).join(' ');
        nominatimGeocode(rough, function(lat3, lng3) {
          if (lat3 && lng3) onSuccess(lat3, lng3);
          else onFail();
        });
      });
    });
  });
}

// ── 지도 초기화 ───────────────────────────────────────
function initMap(id, lat, lng, label) {
  if (mapObjs[id] && mapObjs[id].map) {
    try { mapObjs[id].map.remove(); } catch(e) {}
    delete mapObjs[id];
  }

  var wrap = document.getElementById('map-' + id);
  if (!wrap) return;
  wrap.innerHTML = '<div id="lmap-' + id + '" style="width:100%;height:' + MAP_H + 'px;"></div>';

  var map = L.map('lmap-' + id, { center: [lat, lng], zoom: 17 });

  L.tileLayer(
    'https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/Base/{z}/{y}/{x}.png',
    { attribution: '© <a href="https://www.vworld.kr">VWorld</a>', maxZoom: 19 }
  ).addTo(map);

  var cadastralLayer = L.tileLayer.wms('https://api.vworld.kr/req/wms', {
    layers: 'lt_c_landinfobasemap',
    styles: '', format: 'image/png', transparent: true,
    version: '1.3.0', key: VKEY, maxZoom: 19, attribution: '© VWorld'
  }).addTo(map);

  var marker = L.marker([lat, lng]).addTo(map);
  marker.bindPopup('<div style="font-size:11px;white-space:nowrap;">' + label + '</div>').openPopup();

  mapObjs[id] = { map: map, cadastralLayer: cadastralLayer, marker: marker, cadastralOn: true };

  // ── 거리재기 상태 ──────────────────────────────────
  measureState[id] = {
    on: false,
    points: [],       // 클릭 확정 좌표 배열
    dotMarkers: [],   // 클릭 점 원형 마커
    polyline: null,   // 확정 선
    previewLine: null,// 마우스 따라가는 프리뷰 선
    clickFn: null,
    moveFn: null
  };

  // 지적도 토글
  document.getElementById('cadastral-btn-' + id).onclick = function() {
    var obj = mapObjs[id]; var btn = this;
    if (obj.cadastralOn) {
      map.removeLayer(obj.cadastralLayer); obj.cadastralOn = false;
      btn.classList.remove('layer-on'); btn.textContent = '지적도';
    } else {
      obj.cadastralLayer.addTo(map); obj.cadastralOn = true;
      btn.classList.add('layer-on'); btn.textContent = '지적도 ON';
    }
  };

  // 거리재기
  document.getElementById('measure-btn-' + id).onclick = function() {
    var st = measureState[id]; var btn = this;
    var res = document.getElementById('measure-result-' + id);
    if (st.on) {
      // 종료
      st.on = false;
      btn.classList.remove('active'); btn.textContent = '거리재기';
      map.off('click', st.clickFn);
      map.off('mousemove', st.moveFn);
      map.getContainer().style.cursor = '';
      // 프리뷰 선 제거
      if (st.previewLine) { map.removeLayer(st.previewLine); st.previewLine = null; }
    } else {
      // 시작
      clearMeasure(id);
      st.on = true;
      btn.classList.add('active'); btn.textContent = '측정 종료';
      res.className = 'measure-result';
      map.getContainer().style.cursor = 'crosshair';

      // 클릭: 점 확정
      st.clickFn = function(e) {
        st.points.push(e.latlng);

        // 클릭 점 원형 마커 추가
        var dot = L.circleMarker(e.latlng, {
          radius: 4,
          color: '#b45309',
          fillColor: '#fff',
          fillOpacity: 1,
          weight: 2
        }).addTo(map);
        st.dotMarkers.push(dot);

        // 확정 선 갱신
        if (st.polyline) map.removeLayer(st.polyline);
        if (st.points.length >= 2) {
          st.polyline = L.polyline(st.points, {
            color: '#b45309', weight: 2.5, opacity: 1,
            dashArray: null
          }).addTo(map);

          var dist = 0;
          for (var i = 1; i < st.points.length; i++) dist += st.points[i-1].distanceTo(st.points[i]);
          res.className = 'measure-result show';
          res.textContent = '총 거리: ' + dist.toFixed(1) + ' m  |  구간: ' + (st.points.length - 1) + '개';
        }
      };

      // 마우스 이동: 프리뷰 선 (마지막 확정 점 → 현재 마우스)
      st.moveFn = function(e) {
        if (st.points.length === 0) return;
        var last = st.points[st.points.length - 1];
        if (st.previewLine) map.removeLayer(st.previewLine);
        st.previewLine = L.polyline([last, e.latlng], {
          color: '#b45309', weight: 1.5, opacity: 0.5,
          dashArray: '6 4'  // 점선으로 프리뷰 표시
        }).addTo(map);
      };

      map.on('click', st.clickFn);
      map.on('mousemove', st.moveFn);
    }
  };

  document.getElementById('reset-btn-' + id).onclick = function() {
    var st = measureState[id];
    if (st.on) document.getElementById('measure-btn-' + id).click();
    clearMeasure(id);
    document.getElementById('measure-result-' + id).className = 'measure-result';
  };
}

function clearMeasure(id) {
  var st = measureState[id]; if (!st) return;
  var obj = mapObjs[id];
  if (!obj) return;
  if (st.polyline)     { obj.map.removeLayer(st.polyline);     st.polyline = null; }
  if (st.previewLine)  { obj.map.removeLayer(st.previewLine);  st.previewLine = null; }
  st.dotMarkers.forEach(function(m) { obj.map.removeLayer(m); });
  st.dotMarkers = [];
  st.points = [];
}

function showGeoError(id) {
  var wrap = document.getElementById('map-' + id);
  if (wrap) wrap.innerHTML =
    '<div class="map-placeholder" style="height:' + MAP_H + 'px;flex-direction:column;gap:8px;">'
    + '<span>좌표를 찾을 수 없습니다.</span>'
    + '<span style="font-size:10px;color:var(--text-hint)">도로명주소로 다시 시도해 보세요.</span>'
    + '</div>';
}

// ── 주소 검색 ─────────────────────────────────────────
function openAddressSearch(id) {
  new daum.Postcode({
    oncomplete: function(data) {
      var road  = data.roadAddress || '';
      var jibun = data.jibunAddress || data.autoJibunAddress || '';
      var display = jibun || road;

      document.getElementById('addr-display-' + id).textContent = display;
      var nm = document.getElementById('name-' + id);
      if (nm && !nm.value) nm.value = (data.bname || '') + ' ' + (data.jibun || '');

      ['eum-btn-', 'copy-btn-', 'seoul-btn-'].forEach(function(p) {
        var el = document.getElementById(p + id); if (el) el.classList.add('show');
      });
      var copyBtn = document.getElementById('copy-btn-' + id);
      if (copyBtn) copyBtn.dataset.addr = display;

      var label = (data.bname || '') + ' ' + (data.jibun || '');
      var wrap = document.getElementById('map-' + id);
      if (wrap) wrap.innerHTML = '<div class="map-placeholder" style="height:' + MAP_H + 'px;">좌표 검색 중...</div>';

      geocode(road, jibun,
        function(lat, lng) { initMap(id, lat, lng, label); },
        function() { showGeoError(id); }
      );
    }
  }).open();
}

// ── 지번→도로명 변환 ──────────────────────────────────
function convertToRoad(keyword, onSuccess, onFail) {
  jusoSearch(keyword, function(juso, err) {
    if (juso && juso.roadAddr) { onSuccess(juso.roadAddr); return; }
    onFail(err || '검색 결과가 없습니다.');
  });
}

function runConvert(id) {
  var input   = document.getElementById('conv-input-' + id);
  var result  = document.getElementById('conv-result-' + id);
  var copyBtn = document.getElementById('conv-copy-' + id);
  var q = input && input.value.trim();
  if (!q) return;

  result.className = 'converter-result';
  result.textContent = '변환 중...';
  result.style.display = 'block';
  copyBtn.className = 'converter-copy';

  convertToRoad(q, function(roadAddr) {
    result.className = 'converter-result ok';
    result.textContent = roadAddr;
    copyBtn.className = 'converter-copy show';
    copyBtn.onclick = function() {
      navigator.clipboard.writeText(roadAddr).then(function() {
        copyBtn.textContent = '복사됨 ✓';
        setTimeout(function() { copyBtn.textContent = '도로명 복사'; }, 1500);
      }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = roadAddr; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        copyBtn.textContent = '복사됨 ✓';
        setTimeout(function() { copyBtn.textContent = '도로명 복사'; }, 1500);
      });
    };
  }, function(errMsg) {
    result.className = 'converter-result err';
    result.textContent = errMsg || '변환 실패';
    copyBtn.className = 'converter-copy';
  });
}

// ── 용도지역 → 건폐율 ────────────────────────────────
var ZONE_BCR = {
  '50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,
  '60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,
  '60_ie':60,'60_ig':60,'60_is':60,
  '20_gb':20,'20_gp':20,'20_gn':20
};

function applyZoneBCR(id) {
  var sel  = document.getElementById('zone-sel-' + id);
  var wrap = document.getElementById('bcr-wrap-' + id);
  if (!sel) return;
  if (sel.value === 'custom') { if (wrap) wrap.style.display = 'block'; return; }
  if (wrap) wrap.style.display = 'none';
  var bcr = ZONE_BCR[sel.value];
  if (bcr !== undefined) { document.getElementById('bcr-' + id).value = bcr; calc(id); }
}

function applyCustomBCR(id) {
  var val = parseFloat(document.getElementById('bcr-custom-' + id).value) || 0;
  document.getElementById('bcr-' + id).value = val; calc(id);
}

function copyAddr(id) {
  var btn  = document.getElementById('copy-btn-' + id);
  var addr = (btn && btn.dataset.addr) || '';
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(function() {
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  });
}

// ── 구역 카드 ─────────────────────────────────────────

        + '<div class="metric"><div class="metric-label">최솟값</div><div class="metric-value hi" id="r-minval-' + id + '">—</div></div>'

function removeBlock(id) {
  blocks = blocks.filter(function(b) { return b !== id; });
  var obj = mapObjs[id];
  if (obj && obj.map) { try { obj.map.remove(); } catch(e) {} }
  delete mapObjs[id]; delete measureState[id];
  var el = document.getElementById('block-' + id); if (el) el.remove();
  updateSummary();
}

// ── 계산 ─────────────────────────────────────────────
function v(eid) { var el = document.getElementById(eid); return el ? parseFloat(el.value) || 0 : 0; }

function calcSide(road, front, width, rear) {
  var depth = width - front;
  var minPt = (road + front) * 1.5;
  var maxPt = (road + front + depth - rear) * 1.5;
  return { depth: depth, minPt: minPt, maxPt: maxPt, avgPt: (minPt + maxPt) / 2 };
}

function calc(id) {
  var area = v('area-' + id), bcr = v('bcr-' + id) / 100, rear = v('rear-' + id);
  var rs = calcSide(v('road-s-' + id), v('front-s-' + id), v('width-s-' + id), rear);
  var rl = calcSide(v('road-l-' + id), v('front-l-' + id), v('width-l-' + id), rear);

  var ds = document.getElementById('depth-s-' + id);
  var dl = document.getElementById('depth-l-' + id);
  if (ds) ds.value = rs.depth > 0 ? rs.depth.toFixed(1) : '';
  if (dl) dl.value = rl.depth > 0 ? rl.depth.toFixed(1) : '';

  var hasLong = v('road-l-' + id) > 0 || v('width-l-' + id) > 0;
  var minVal, dMin, dMax, dAvg;
  if (hasLong && rl.avgPt > 0) {
    minVal = Math.min(rs.avgPt, rl.avgPt);
    dMin = Math.min(rs.minPt, rl.minPt);
    dMax = Math.max(rs.maxPt, rl.maxPt);
    dAvg = (rs.avgPt + rl.avgPt) / 2;
  } else {
    minVal = rs.avgPt; dMin = rs.minPt; dMax = rs.maxPt; dAvg = rs.avgPt;
  }

  var floor = area * bcr, vol = floor * minVal;
  var fmt  = function(n) { return n > 0 ? n.toFixed(1) : '—'; };
  var fmt0 = function(n) { return n > 0 ? Math.round(n).toLocaleString() : '—'; };
  var u    = function(s) { return '<span class="metric-unit">' + s + '</span>'; };

  document.getElementById('r-min-'    + id).innerHTML = fmt(dMin)   + (dMin   > 0 ? u('m')  : '');
  document.getElementById('r-max-'    + id).innerHTML = fmt(dMax)   + (dMax   > 0 ? u('m')  : '');
  document.getElementById('r-avg-'    + id).innerHTML = fmt(dAvg)   + (dAvg   > 0 ? u('m')  : '');
  document.getElementById('r-minval-' + id).innerHTML = fmt(minVal) + (minVal > 0 ? u('m')  : '');
  document.getElementById('r-floor-'  + id).innerHTML = fmt(floor)  + (floor  > 0 ? u('㎡') : '');
  document.getElementById('r-vol-'    + id).innerHTML = fmt0(vol)   + (vol    > 0 ? u('㎡') : '');
  updateSummary();
}

function updateSummary() {
  var tF = 0, tV = 0, valid = false;
  var listEl = document.getElementById('summary-list');
  listEl.innerHTML = '';

  blocks.forEach(function(id) {
    var area = v('area-' + id), bcr = v('bcr-' + id) / 100, rear = v('rear-' + id);
    var rs = calcSide(v('road-s-' + id), v('front-s-' + id), v('width-s-' + id), rear);
    var rl = calcSide(v('road-l-' + id), v('front-l-' + id), v('width-l-' + id), rear);
    var hasLong = v('road-l-' + id) > 0 || v('width-l-' + id) > 0;
    var minVal = (hasLong && rl.avgPt > 0) ? Math.min(rs.avgPt, rl.avgPt) : rs.avgPt;
    var floor = area * bcr, vol = floor * minVal;
    var nameEl = document.getElementById('name-' + id);
    var name = (nameEl && nameEl.value) || ('구역 ' + id);

    var item = document.createElement('div');
    item.className = 'summary-block-item';
    item.innerHTML =
      '<div class="summary-block-name">' + String(id).padStart(2,'0') + ' ' + name + '</div>'
      + '<div class="summary-block-vals">'
        + '<div class="sval">허용높이 <span>' + (minVal > 0 ? minVal.toFixed(1) + 'm' : '—') + '</span></div>'
        + '<div class="sval">면적 <span>' + (area > 0 ? area.toLocaleString() + '㎡' : '—') + '</span></div>'
        + '<div class="sval">바닥면적 <span>' + (floor > 0 ? Math.round(floor).toLocaleString() + '㎡' : '—') + '</span></div>'
        + '<div class="sval">체적 <span>' + (vol > 0 ? Math.round(vol).toLocaleString() + '㎡' : '—') + '</span></div>'
      + '</div>';
    listEl.appendChild(item);
    if (area > 0 && minVal > 0) { tF += floor; tV += vol; valid = true; }
  });

  var avgH = tF > 0 ? tV / tF : 0;
  document.getElementById('avg-height').textContent = valid ? avgH.toFixed(1) : '—';
  document.getElementById('sum-vol').textContent = valid ? Math.round(tV).toLocaleString() + ' ㎡' : '—';
}

addBlock();
</script>
