<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #fff; --border: #e0ddd6; --border-light: #ece9e2;
    --text: #1a1916; --text-sub: #6b6860; --text-hint: #a09e98;
    --accent: #2d5be3; --accent-bg: #eef2fd; --accent-text: #1a3fa0;
    --success: #1a7a4a; --success-bg: #eaf5ee; --danger: #c0392b;
    --warn: #b45309; --warn-bg: #fef3c7;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  header span { font-size: 12px; color: var(--text-hint); font-family: 'DM Mono', monospace; }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); }
  .add-btn { font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--accent); background: var(--accent-bg); border: none; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  .add-btn:hover { opacity: 0.8; }
  .block-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .block-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border-light); background: #faf9f7; }
  .block-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-hint); background: var(--border-light); border-radius: 4px; padding: 2px 8px; margin-right: 10px; }
  .block-name-input { font-size: 14px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; border: none; background: transparent; color: var(--text); outline: none; width: 220px; }
  .block-name-input::placeholder { color: var(--text-hint); }
  .remove-btn { font-size: 12px; color: var(--text-hint); background: none; border: 1px solid var(--border); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .remove-btn:hover { color: var(--danger); border-color: var(--danger); }
  .block-body { padding: 18px 20px; }
  .block-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  .block-inputs { min-width: 0; }
  .map-panel { display: flex; flex-direction: column; gap: 8px; }
  .map-wrap { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light); height: 280px; background: var(--bg); position: relative; }
  .map-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-hint); text-align: center; line-height: 1.8; }
  .leaflet-map { width: 100%; height: 100%; }
  .map-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-btn { font-size: 11px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; }
  .tool-btn:hover { background: var(--bg); }
  .tool-btn.active { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .measure-result { font-size: 12px; color: var(--warn); background: var(--warn-bg); border-radius: 5px; padding: 6px 10px; display: none; }
  .measure-result.show { display: block; }
  .addr-section { margin-bottom: 18px; }
  .field-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 8px; }
  .addr-row { display: flex; gap: 8px; }
  input[type="text"], input[type="number"] { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; outline: none; transition: border-color 0.15s; width: 100%; }
  input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); }
  input.addr-input { background: #faf9f7; cursor: pointer; }
  .lookup-btn { font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--accent); border: none; border-radius: 7px; padding: 8px 18px; cursor: pointer; white-space: nowrap; }
  .status-msg { font-size: 12px; margin-top: 6px; min-height: 18px; }
  .status-ok { color: var(--success); }
  .divider { border: none; border-top: 1px solid var(--border-light); margin: 16px 0; }
  .inputs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .input-field { display: flex; flex-direction: column; gap: 5px; }
  .input-field label { font-size: 11px; color: var(--text-sub); }
  .side-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .side-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
  .result-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); }
  .metric { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .metric-label { font-size: 10px; color: var(--text-hint); margin-bottom: 4px; }
  .metric-value { font-size: 16px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text); }
  .metric-value.highlight { color: var(--accent); }
  .metric-unit { font-size: 10px; color: var(--text-hint); margin-left: 1px; font-family: 'Noto Sans KR', sans-serif; font-weight: 400; }
  .summary-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 8px; }
  .summary-title { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .summary-metric { padding: 12px 14px; background: var(--bg); border-radius: 8px; }
  .summary-metric-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
  .summary-metric-value { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .summary-metric-value.big { color: var(--accent); font-size: 24px; }
  .summary-metric-unit { font-size: 11px; color: var(--text-hint); font-family: 'Noto Sans KR', sans-serif; }
  .zone-select { font-family:'Noto Sans KR',sans-serif; font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:6px 8px; width:100%; cursor:pointer; }
  .eum-btn { display:none; font-size:11px; font-family:'Noto Sans KR',sans-serif; font-weight:500; padding:7px 12px; border-radius:5px; border:1px solid var(--accent); background:var(--accent-bg); color:var(--accent-text); cursor:pointer; text-decoration:none; text-align:center; width:100%; }
  .eum-btn:hover { background:var(--accent); color:#fff; }
  .eum-btn.show { display:block; }
  @media (max-width: 750px) {
    .block-layout { grid-template-columns: 1fr; }
    .inputs-grid { grid-template-columns: 1fr 1fr; }
    .result-strip { grid-template-columns: repeat(3, 1fr); }
    .summary-grid { grid-template-columns: 1fr 1fr; }
    header { padding: 16px 20px; }
    .container { padding: 20px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>블록별 최고높이 검토</h1>
  <span>도로사선 기반 · 지구단위계획</span>
</header>

<div class="container">
  <div class="top-bar">
    <span class="top-bar-label">구역 목록</span>
    <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
  </div>
  <div id="blocks-container"></div>
  <div class="summary-panel">
    <div class="summary-title">블록 전체 요약</div>
    <div class="summary-grid">
      <div class="summary-metric"><div class="summary-metric-label">총 대지면적</div><div class="summary-metric-value" id="sum-area">—</div><div class="summary-metric-unit">㎡</div></div>
      <div class="summary-metric"><div class="summary-metric-label">총 건물바닥면적</div><div class="summary-metric-value" id="sum-floor">—</div><div class="summary-metric-unit">㎡</div></div>
      <div class="summary-metric"><div class="summary-metric-label">총 체적</div><div class="summary-metric-value" id="sum-vol">—</div><div class="summary-metric-unit">㎡</div></div>
      <div class="summary-metric"><div class="summary-metric-label">블록평균높이</div><div class="summary-metric-value big" id="avg-height">—</div><div class="summary-metric-unit">m</div></div>
    </div>
  </div>
</div>

<script>
var blockCount = 0, blocks = [], mapObjs = {}, measureState = {};

// ── 좌표 직접 받아서 지도 표시 (카카오 주소검색 결과 활용) ──
function geocodeAndShowMap(id, lat, lng, label) {
  initLeafletMap(id, lat, lng, label);
}

// ── Leaflet 지도 초기화 ────────────────────────────
function initLeafletMap(id, lat, lng, label) {
  var wrap = document.getElementById('map-' + id);
  if (!wrap) return;
  wrap.innerHTML = '<div id="leaflet-' + id + '" style="width:100%;height:100%;"></div>';
  var KEY = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';

  setTimeout(function() {
    var map = L.map('leaflet-' + id).setView([lat, lng], 17);

    // V-World WMTS 기본지도
    var baseLayer = L.tileLayer(
      'https://api.vworld.kr/req/wmts/1.0.0/' + KEY + '/Base/{z}/{y}/{x}.png',
      { maxZoom: 19, attribution: '© V-World' }
    ).addTo(map);

    // 지적도 WMS (기본 ON)
    var cadastralLayer = L.tileLayer.wms(
      'https://api.vworld.kr/req/wms?KEY=' + KEY,
      { layers: 'lt_c_landinfobasemap', format: 'image/png', transparent: true, version: '1.3.0', opacity: 0.8, maxZoom: 19, maxNativeZoom: 19 }
    ).addTo(map);

    // 위성 레이어
    var satLayer = L.tileLayer(
      'https://api.vworld.kr/req/wmts/1.0.0/' + KEY + '/Satellite/{z}/{y}/{x}.jpeg',
      { maxZoom: 19, attribution: '© V-World' }
    );

    var marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup('<b>' + label + '</b>').openPopup();

    mapObjs[id] = { map: map, baseLayer: baseLayer, cadastralLayer: cadastralLayer, satLayer: satLayer, cadastralOn: true, satOn: false };
    measureState[id] = { on: false, points: [], polyline: null, markers: [], clickFn: null };
    map.invalidateSize();

    // 지적도 버튼 초기 ON 표시
    var cBtn = document.getElementById('cadastral-btn-' + id);
    if (cBtn) { cBtn.classList.add('layer-on'); cBtn.textContent = '지적도 ON'; }
  }, 100);
}


// ── 용도지역 드롭다운 ────────────────────────────
var ZONE_BCR_MAP = {'50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,'60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,'60_ie':60,'60_ig':60,'60_is':60,'20_gb':20,'20_gp':20,'20_gn':20};
function applyZoneBCR(id) {
  var sel = document.getElementById('zone-sel-' + id);
  if (!sel || !sel.value) return;
  var bcr = ZONE_BCR_MAP[sel.value];
  if (bcr !== undefined) { document.getElementById('bcr-' + id).value = bcr; calc(id); }
}

function openAddressSearch(id) {
  new daum.Postcode({
    oncomplete: function(data) {
      var jibun = data.jibunAddress || data.autoJibunAddress || '';
      var display = jibun || data.roadAddress;
      document.getElementById('addr-' + id).value = display;
      var nm = document.getElementById('name-' + id);
      if (!nm.value) nm.value = (data.bname || '') + ' ' + (data.jibun || '');
      var msg = document.getElementById('msg-' + id);
      msg.className = 'status-msg status-ok';
      msg.textContent = '✓ 주소 선택 완료 — 대지면적을 직접 입력해주세요.';
      var eumBtn = document.getElementById('eum-btn-' + id);
      var copyBtn = document.getElementById('copy-btn-' + id);
      var seoulBtn = document.getElementById('seoul-btn-' + id);
      if (eumBtn) { eumBtn.className = 'eum-btn show'; }
      if (copyBtn) { copyBtn.className = 'eum-btn show'; copyBtn.dataset.addr = display; }
      if (seoulBtn) { seoulBtn.className = 'eum-btn show'; }
      var label = (data.bname || '') + ' ' + (data.jibun || '');
      // vworld 주소→좌표 변환 API
      var vkey = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
      var addrParam = encodeURIComponent(display);
      fetch('https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326&address=' + addrParam + '&refine=true&simple=false&format=json&type=parcel&key=' + vkey)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.response && d.response.status === 'OK') {
            var pt = d.response.result.point;
            geocodeAndShowMap(id, parseFloat(pt.y), parseFloat(pt.x), label);
          } else {
            // 지번 실패시 도로명으로 재시도
            return fetch('https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326&address=' + encodeURIComponent(data.roadAddress || display) + '&refine=true&simple=false&format=json&type=road&key=' + vkey)
              .then(function(r2) { return r2.json(); })
              .then(function(d2) {
                if (d2.response && d2.response.status === 'OK') {
                  var pt2 = d2.response.result.point;
                  geocodeAndShowMap(id, parseFloat(pt2.y), parseFloat(pt2.x), label);
                } else {
                  geocodeAndShowMap(id, 37.5665, 126.9780, label);
                }
              });
          }
        })
        .catch(function() { geocodeAndShowMap(id, 37.5665, 126.9780, label); });
    }
  }).open();
}

// ── 거리재기 ──────────────────────────────────────
function toggleMeasure(id) {
  if (!mapObjs[id]) return;
  var st = measureState[id];
  var map = mapObjs[id].map;
  var btn = document.getElementById('measure-btn-' + id);
  var res = document.getElementById('measure-result-' + id);

  if (st.on) {
    // 측정 종료
    st.on = false;
    btn.classList.remove('active');
    btn.textContent = '거리재기';
    map.off('click', st.clickFn);
    map.getContainer().style.cursor = '';
  } else {
    // 측정 시작
    clearMeasure(id);
    st.on = true;
    btn.classList.add('active');
    btn.textContent = '측정 종료';
    res.className = 'measure-result';
    map.getContainer().style.cursor = 'crosshair';

    st.clickFn = function(e) {
      var ll = e.latlng;
      st.points.push(ll);

      // 점 마커
      var dot = L.circleMarker(ll, {
        radius: 4, color: '#b45309', fillColor: '#b45309', fillOpacity: 1, weight: 1
      }).addTo(map);
      st.markers.push(dot);

      // 선 업데이트
      if (st.polyline) map.removeLayer(st.polyline);
      if (st.points.length >= 2) {
        st.polyline = L.polyline(st.points, { color: '#b45309', weight: 2, opacity: 0.9 }).addTo(map);
        // 거리 계산 (미터)
        var dist = 0;
        for (var i = 1; i < st.points.length; i++) {
          dist += st.points[i-1].distanceTo(st.points[i]);
        }
        res.className = 'measure-result show';
        res.textContent = '총 거리: ' + dist.toFixed(1) + ' m';
      }
    };
    map.on('click', st.clickFn);
  }
}

function clearMeasure(id) {
  var st = measureState[id];
  if (!st || !mapObjs[id]) return;
  var map = mapObjs[id].map;
  if (st.polyline) { map.removeLayer(st.polyline); st.polyline = null; }
  st.markers.forEach(function(m) { map.removeLayer(m); });
  st.points = []; st.markers = [];
}

function resetMeasure(id) {
  if (!mapObjs[id]) return;
  var st = measureState[id];
  if (st && st.on) toggleMeasure(id);
  clearMeasure(id);
  var res = document.getElementById('measure-result-' + id);
  if (res) res.className = 'measure-result';
}

// ── 구역 카드 생성 ────────────────────────────────
function copyAddr(id) {
  var btn = document.getElementById('copy-btn-' + id);
  if (!btn) return;
  var addr = btn.dataset.addr || '';
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(function() {
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  });
}

function addBlock() {
  blockCount++;
  var id = blockCount;
  blocks.push(id);
  var div = document.createElement('div');
  div.className = 'block-card';
  div.id = 'block-' + id;
  div.innerHTML = ''
    + '<div class="block-header">'
    +   '<div style="display:flex;align-items:center;">'
    +     '<span class="block-num">' + String(id).padStart(2,'0') + '</span>'
    +     '<input class="block-name-input" type="text" placeholder="구역명 입력" id="name-' + id + '">'
    +   '</div>'
    +   '<button class="remove-btn" onclick="removeBlock(' + id + ')">삭제</button>'
    + '</div>'
    + '<div class="block-body"><div class="block-layout"><div class="block-inputs">'
    +   '<div class="addr-section"><div class="field-label">주소 검색</div>'
    +     '<div class="addr-row">'
    +       '<input type="text" id="addr-' + id + '" class="addr-input" placeholder="주소 검색 버튼을 눌러주세요" readonly onclick="openAddressSearch(' + id + ')">'
    +       '<button class="lookup-btn" onclick="openAddressSearch(' + id + ')">주소 검색</button>'
    +     '</div>'
    +     '<div class="status-msg" id="msg-' + id + '"></div>'
    +   '</div>'
    +   '<hr class="divider">'

    +   '<div class="side-label">공통</div>'
    +   '<div class="inputs-grid">'
    +     '<div class="input-field"><label>대지면적 (㎡)</label><input type="number" id="area-' + id + '" placeholder="직접 입력" oninput="calc(' + id + ')"></div>'
    +     '<div class="input-field"><label>용도지역</label><select class="zone-select" id="zone-sel-' + id + '" onchange="applyZoneBCR(' + id + ')"><option value="">— 선택 —</option><option value="50">제1종전용주거 (50%)</option><option value="40">제2종전용주거 (40%)</option><option value="60_1">제1종일반주거 (60%)</option><option value="60_2">제2종일반주거 (60%)</option><option value="50_3">제3종일반주거 (50%)</option><option value="60_j">준주거 (60%)</option><option value="60_cs">중심상업 (60%)</option><option value="60_cg">일반상업 (60%)</option><option value="60_cn">근린상업 (60%)</option><option value="60_cd">유통상업 (60%)</option><option value="60_ie">전용공업 (60%)</option><option value="60_ig">일반공업 (60%)</option><option value="60_is">준공업 (60%)</option><option value="20_gb">보전녹지 (20%)</option><option value="20_gp">생산녹지 (20%)</option><option value="20_gn">자연녹지 (20%)</option></select></div>'
    +     '<div class="input-field"><label>건폐율 (%)</label><input type="number" id="bcr-' + id + '" value="60" oninput="calc(' + id + ')"></div>'
    +     '<div class="input-field"><label>후면건축선후퇴 (m)</label><input type="number" id="rear-' + id + '" value="0" oninput="calc(' + id + ')"></div>'
    +   '</div>'
    +   '<div class="side-label">단변</div>'
    +   '<div class="inputs-grid">'
    +     '<div class="input-field"><label>전면도로폭 (m)</label><input type="number" id="road-s-' + id + '" placeholder="예: 50" oninput="calc(' + id + ')"></div>'
    +     '<div class="input-field"><label>전면건축선후퇴 (m)</label><input type="number" id="front-s-' + id + '" value="3" oninput="calc(' + id + ')"></div>'
    +     '<div class="input-field"><label>획지폭 (m)</label><input type="number" id="width-s-' + id + '" placeholder="예: 24.6" oninput="calc(' + id + ')"></div>'
    +   '</div>'
    +   '<div id="longside-' + id + '">'
    +     '<div class="side-label">장변</div>'
    +     '<div class="inputs-grid">'
    +       '<div class="input-field"><label>전면도로폭 (m)</label><input type="number" id="road-l-' + id + '" placeholder="예: 50" oninput="calc(' + id + ')"></div>'
    +       '<div class="input-field"><label>전면건축선후퇴 (m)</label><input type="number" id="front-l-' + id + '" value="3" oninput="calc(' + id + ')"></div>'
    +       '<div class="input-field"><label>획지폭 (m)</label><input type="number" id="width-l-' + id + '" placeholder="예: 62" oninput="calc(' + id + ')"></div>'
    +     '</div>'
    +   '</div>'
    +   '<div class="result-strip">'
    +     '<div class="metric"><div class="metric-label">최저점</div><div class="metric-value" id="r-min-' + id + '">—</div></div>'
    +     '<div class="metric"><div class="metric-label">최고점</div><div class="metric-value" id="r-max-' + id + '">—</div></div>'
    +     '<div class="metric"><div class="metric-label">평균점</div><div class="metric-value" id="r-avg-' + id + '">—</div></div>'
    +     '<div class="metric"><div class="metric-label">최솟값 (허용높이)</div><div class="metric-value highlight" id="r-minval-' + id + '">—</div></div>'
    +     '<div class="metric"><div class="metric-label">건물바닥면적</div><div class="metric-value" id="r-floor-' + id + '">—</div></div>'
    +     '<div class="metric"><div class="metric-label">체적</div><div class="metric-value" id="r-vol-' + id + '">—</div></div>'
    +   '</div>'
    + '</div>'
    + '<div class="map-panel">'
    +   '<div class="map-wrap"><div id="map-' + id + '" class="map-placeholder">주소를 검색하면<br>지도가 표시됩니다</div></div>'
    +   '<div style="display:flex;gap:6px;flex-wrap:wrap;">'
    +   '<button class="eum-btn" id="copy-btn-' + id + '" onclick="copyAddr(' + id + ')" style="flex:1;">주소 복사</button>'
    +   '<a class="eum-btn" id="eum-btn-' + id + '" target="_blank" href="https://www.eum.go.kr/web/am/amMain.jsp" style="flex:2;">토지이음 ↗</a>'
    +   '<a class="eum-btn" id="seoul-btn-' + id + '" target="_blank" href="https://urban.seoul.go.kr/view/map/main.html" style="flex:2;">서울도시공간포털 ↗</a>'
    +   '</div>'
    +   '<div class="map-tools">'
    +     '<button class="tool-btn layer-on" id="cadastral-btn-' + id + '" onclick="toggleCadastral(' + id + ')">지적도 ON</button>'
    +     '<button class="tool-btn" id="sat-btn-' + id + '" onclick="toggleSatellite(' + id + ')">위성</button>'
    +     '<button class="tool-btn" id="measure-btn-' + id + '" onclick="toggleMeasure(' + id + ')">거리재기</button>'
    +     '<button class="tool-btn" onclick="resetMeasure(' + id + ')">초기화</button>'
    +   '</div>'
    +   '<div class="measure-result" id="measure-result-' + id + '"></div>'
    + '</div>'
    + '</div></div></div>';
  document.getElementById('blocks-container').appendChild(div);
}

function removeBlock(id) {
  blocks = blocks.filter(function(b) { return b !== id; });
  if (measureState[id] && measureState[id].on) toggleMeasure(id);
  if (mapObjs[id]) { mapObjs[id].map.remove(); }
  delete mapObjs[id]; delete measureState[id];
  var el = document.getElementById('block-' + id);
  if (el) el.remove();
  updateSummary();
}

function setMode(id, mode) { calc(id); }
function getMode(id) { return 'both'; }
function v(eid) { var el = document.getElementById(eid); return el ? parseFloat(el.value) || 0 : 0; }
function calcSide(road, front, width, rear) {
  var d = width - front, mn = (road + front) * 1.5, mx = (road + front + d - rear) * 1.5;
  return { minPt: mn, maxPt: mx, avgPt: (mn + mx) / 2 };
}
function calc(id) {
  var area = v('area-'+id), bcr = v('bcr-'+id)/100, rear = v('rear-'+id), mode = getMode(id);
  var rs = calcSide(v('road-s-'+id), v('front-s-'+id), v('width-s-'+id), rear);
  var minVal, dMin, dMax, dAvg;
  if (mode === 'both') {
    var rl = calcSide(v('road-l-'+id), v('front-l-'+id), v('width-l-'+id), rear);
    minVal = Math.min(rs.avgPt, rl.avgPt); dMin = Math.min(rs.minPt, rl.minPt);
    dMax = Math.max(rs.maxPt, rl.maxPt); dAvg = (rs.avgPt + rl.avgPt) / 2;
  } else { minVal = rs.avgPt; dMin = rs.minPt; dMax = rs.maxPt; dAvg = rs.avgPt; }
  var floor = area * bcr, vol = floor * minVal;
  var fmt = function(n) { return n > 0 ? n.toFixed(1) : '—'; };
  var fmt0 = function(n) { return n > 0 ? Math.round(n).toLocaleString() : '—'; };
  var u = function(s) { return '<span class="metric-unit">'+s+'</span>'; };
  document.getElementById('r-min-'+id).innerHTML    = fmt(dMin)   + (dMin   > 0 ? u('m')  : '');
  document.getElementById('r-max-'+id).innerHTML    = fmt(dMax)   + (dMax   > 0 ? u('m')  : '');
  document.getElementById('r-avg-'+id).innerHTML    = fmt(dAvg)   + (dAvg   > 0 ? u('m')  : '');
  document.getElementById('r-minval-'+id).innerHTML = fmt(minVal) + (minVal > 0 ? u('m')  : '');
  document.getElementById('r-floor-'+id).innerHTML  = fmt(floor)  + (floor  > 0 ? u('㎡') : '');
  document.getElementById('r-vol-'+id).innerHTML    = fmt0(vol)   + (vol    > 0 ? u('㎡') : '');
  updateSummary();
}
function updateSummary() {
  var tA=0, tF=0, tV=0, valid=false;
  blocks.forEach(function(id) {
    var area=v('area-'+id), bcr=v('bcr-'+id)/100, rear=v('rear-'+id);
    var rs=calcSide(v('road-s-'+id),v('front-s-'+id),v('width-s-'+id),rear);
    var minVal=rs.avgPt;
    if (getMode(id)==='both') {
      var rl=calcSide(v('road-l-'+id),v('front-l-'+id),v('width-l-'+id),rear);
      minVal=Math.min(rs.avgPt,rl.avgPt);
    }
    var f=area*bcr, vol=f*minVal;
    if (area>0 && minVal>0) { tA+=area; tF+=f; tV+=vol; valid=true; }
  });
  var avgH = tF>0 ? tV/tF : 0;
  document.getElementById('sum-area').textContent  = valid ? Math.round(tA).toLocaleString() : '—';
  document.getElementById('sum-floor').textContent = valid ? Math.round(tF).toLocaleString() : '—';
  document.getElementById('sum-vol').textContent   = valid ? Math.round(tV).toLocaleString() : '—';
  document.getElementById('avg-height').textContent= valid ? avgH.toFixed(1) : '—';
}

addBlock();
</script>
</body>
</html>
