<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3ef; --surface: #fff; --border: #e0ddd6; --border-light: #ece9e2;
  --text: #1a1916; --text-sub: #6b6860; --text-hint: #a09e98;
  --accent: #2d5be3; --accent-bg: #eef2fd; --accent-text: #1a3fa0;
  --danger: #c0392b; --warn: #b45309; --warn-bg: #fef3c7;
  --success: #1a7a4a; --success-bg: #eaf5ee;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* ── 헤더 ── */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 100; }
header h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
header span { font-size: 11px; color: var(--text-hint); font-family: 'DM Mono', monospace; }
.add-btn { font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--accent); background: var(--accent-bg); border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.add-btn:hover { opacity: 0.8; }

/* ── 메인 레이아웃: 좌(지도) + 우(구역목록) ── */
.main { display: grid; grid-template-columns: 1fr 380px; flex: 1; overflow: hidden; }

/* ── 좌측: 공유 지도 ── */
.map-panel { position: relative; background: var(--bg); display: flex; flex-direction: column; }
#shared-map { flex: 1; }
.map-tools-bar { display: flex; gap: 6px; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.tool-btn { font-size: 11px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; }
.tool-btn:hover { background: var(--bg); }
.tool-btn.active { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tool-btn.layer-on { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }
.map-addr-badge { font-size: 11px; color: var(--text-sub); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 4px 10px; font-family: 'DM Mono', monospace; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.measure-result-bar { font-size: 11px; color: var(--warn); font-family: 'DM Mono', monospace; padding: 0 4px; display: none; }
.measure-result-bar.show { display: block; }

/* ── 우측: 구역 목록 ── */
.blocks-panel { border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.blocks-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.blocks-header-title { font-size: 11px; font-weight: 600; color: var(--text-hint); letter-spacing: 0.06em; text-transform: uppercase; }
.blocks-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ── 구역 카드 (세로형) ── */
.block-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.block-card:hover { border-color: var(--accent); }
.block-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.block-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #faf9f7; border-bottom: 1px solid var(--border-light); }
.block-header-left { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.block-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-hint); background: var(--border-light); border-radius: 3px; padding: 2px 6px; flex-shrink: 0; }
.block-name-input { font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; border: none; background: transparent; color: var(--text); outline: none; min-width: 0; flex: 1; }
.block-name-input::placeholder { color: var(--text-hint); }
.remove-btn { font-size: 10px; color: var(--text-hint); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0; }
.remove-btn:hover { color: var(--danger); border-color: var(--danger); }

.block-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

/* 주소 행 */
.addr-row { display: flex; align-items: center; gap: 6px; }
.addr-display { font-size: 11px; color: var(--text-sub); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr-display.empty { color: var(--text-hint); }
.addr-search-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--accent); border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; }
.addr-search-btn:hover { opacity: 0.85; }

/* 외부 링크 행 */
.link-row { display: flex; gap: 4px; flex-wrap: wrap; }
.link-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; text-decoration: none; display: inline-block; }
.link-btn:hover { background: var(--bg); color: var(--text); }

/* 지번→도로명 변환기 */
.converter-row { display: flex; gap: 4px; }
.converter-input { flex: 1; font-size: 11px; font-family: 'Noto Sans KR', sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 7px; outline: none; min-width: 0; }
.converter-input:focus { border-color: var(--accent); background: var(--surface); }
.converter-btn { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--surface); background: var(--text-sub); border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.converter-btn:hover { background: var(--text); }
.converter-result { font-size: 10px; line-height: 1.5; padding: 5px 7px; border-radius: 4px; word-break: break-all; display: none; }
.converter-result.ok  { background: var(--success-bg); color: var(--success); display: block; }
.converter-result.err { background: var(--warn-bg); color: var(--warn); display: block; }
.converter-copy { font-size: 10px; font-family: 'Noto Sans KR', sans-serif; margin-top: 3px; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); cursor: pointer; width: 100%; display: none; }
.converter-copy.show { display: block; }

/* 구분선 */
.divider { border: none; border-top: 1px solid var(--border-light); margin: 2px 0; }

/* 입력 그리드 */
.input-section-label { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); display: flex; align-items: center; gap: 4px; }
.input-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
.inputs-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.inputs-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.input-field { display: flex; flex-direction: column; gap: 2px; }
.input-field label { font-size: 9px; color: var(--text-hint); }
input[type="number"], select { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; outline: none; width: 100%; }
input[type="number"]:focus, select:focus { border-color: var(--accent); background: var(--surface); }
.readonly-input { background: #faf9f7 !important; }

/* 결과 스트립 */
.result-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.metric { background: var(--bg); border-radius: 4px; padding: 5px 6px; }
.metric-label { font-size: 8px; color: var(--text-hint); margin-bottom: 1px; }
.metric-value { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; }
.metric-value.hi { color: var(--accent); }
.metric-unit { font-size: 8px; color: var(--text-hint); }

/* ── 요약 패널 (우측 하단 고정) ── */
.summary-footer { border-top: 1px solid var(--border); padding: 10px 14px; background: var(--surface); flex-shrink: 0; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.summary-item { }
.summary-label { font-size: 9px; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.summary-value { font-size: 18px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
.summary-unit { font-size: 10px; color: var(--text-hint); }

.bcr-custom-wrap { display: none; margin-top: 3px; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <h1>블록별 최고높이 검토</h1>
    <span>도로사선 기반 · 지구단위계획</span>
  </div>
  <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
</header>

<div class="main">

  <!-- 좌측: 공유 지도 -->
  <div class="map-panel">
    <div id="shared-map"></div>
    <div class="map-tools-bar">
      <button class="tool-btn layer-on" id="cadastral-btn">지적도 ON</button>
      <button class="tool-btn" id="measure-btn">거리재기</button>
      <button class="tool-btn" id="reset-btn">초기화</button>
      <div class="map-addr-badge" id="map-addr-badge">주소를 검색하면 지도가 이동합니다</div>
      <div class="measure-result-bar" id="measure-result-bar"></div>
    </div>
  </div>

  <!-- 우측: 구역 목록 -->
  <div class="blocks-panel">
    <div class="blocks-header">
      <span class="blocks-header-title">구역 목록</span>
    </div>
    <div class="blocks-scroll" id="blocks-container"></div>
    <div class="summary-footer">
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">블록평균높이</div>
          <div><span class="summary-value" id="avg-height">—</span> <span class="summary-unit">m</span></div>
        </div>
        <div class="summary-item">
          <div class="summary-label">총 체적</div>
          <div><span class="summary-value" id="sum-vol" style="font-size:13px;">—</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
var VKEY     = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
var JUSO_KEY = 'U01TX0FVVEgyMDI2MDQwNzE0MzkwODExNzg2NTc=';
var blockCount = 0, blocks = [], activeBlockId = null;
var pnuStore = {};

// ── 공유 지도 초기화 ──────────────────────────────────
var sharedMap = L.map('shared-map', { center: [37.5665, 126.9780], zoom: 13 });

L.tileLayer(
  'https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/Base/{z}/{y}/{x}.png',
  { attribution: '© <a href="https://www.vworld.kr">VWorld</a>', maxZoom: 19 }
).addTo(sharedMap);

var cadastralLayer = L.tileLayer.wms('https://api.vworld.kr/req/wms', {
  layers: 'lt_c_landinfobasemap',
  styles: '', format: 'image/png', transparent: true,
  version: '1.3.0', key: VKEY, maxZoom: 19, attribution: '© VWorld'
}).addTo(sharedMap);

var cadastralOn = true;
var currentMarker = null;
var measureState = { on: false, points: [], dotMarkers: [], polyline: null, previewLine: null, clickFn: null, moveFn: null };

// 지적도 토글
document.getElementById('cadastral-btn').onclick = function() {
  var btn = this;
  if (cadastralOn) {
    sharedMap.removeLayer(cadastralLayer); cadastralOn = false;
    btn.classList.remove('layer-on'); btn.textContent = '지적도';
  } else {
    cadastralLayer.addTo(sharedMap); cadastralOn = true;
    btn.classList.add('layer-on'); btn.textContent = '지적도 ON';
  }
};

// 거리재기
document.getElementById('measure-btn').onclick = function() {
  var btn = this;
  var res = document.getElementById('measure-result-bar');
  if (measureState.on) {
    measureState.on = false; btn.classList.remove('active'); btn.textContent = '거리재기';
    sharedMap.off('click', measureState.clickFn);
    sharedMap.off('mousemove', measureState.moveFn);
    sharedMap.getContainer().style.cursor = '';
    if (measureState.previewLine) { sharedMap.removeLayer(measureState.previewLine); measureState.previewLine = null; }
  } else {
    clearMeasure();
    measureState.on = true; btn.classList.add('active'); btn.textContent = '측정 종료';
    res.className = 'measure-result-bar';
    sharedMap.getContainer().style.cursor = 'crosshair';

    measureState.clickFn = function(e) {
      measureState.points.push(e.latlng);
      var dot = L.circleMarker(e.latlng, { radius: 4, color: '#b45309', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(sharedMap);
      measureState.dotMarkers.push(dot);
      if (measureState.polyline) sharedMap.removeLayer(measureState.polyline);
      if (measureState.points.length >= 2) {
        measureState.polyline = L.polyline(measureState.points, { color: '#b45309', weight: 2.5, opacity: 1 }).addTo(sharedMap);
        var dist = 0;
        for (var i = 1; i < measureState.points.length; i++) dist += measureState.points[i-1].distanceTo(measureState.points[i]);
        res.className = 'measure-result-bar show';
        res.textContent = '총 거리: ' + dist.toFixed(1) + ' m  |  구간: ' + (measureState.points.length - 1) + '개';
      }
    };
    measureState.moveFn = function(e) {
      if (measureState.points.length === 0) return;
      var last = measureState.points[measureState.points.length - 1];
      if (measureState.previewLine) sharedMap.removeLayer(measureState.previewLine);
      measureState.previewLine = L.polyline([last, e.latlng], { color: '#b45309', weight: 1.5, opacity: 0.5, dashArray: '6 4' }).addTo(sharedMap);
    };
    sharedMap.on('click', measureState.clickFn);
    sharedMap.on('mousemove', measureState.moveFn);
  }
};

document.getElementById('reset-btn').onclick = function() {
  if (measureState.on) document.getElementById('measure-btn').click();
  clearMeasure();
  document.getElementById('measure-result-bar').className = 'measure-result-bar';
};

function clearMeasure() {
  if (measureState.polyline)    { sharedMap.removeLayer(measureState.polyline);    measureState.polyline = null; }
  if (measureState.previewLine) { sharedMap.removeLayer(measureState.previewLine); measureState.previewLine = null; }
  measureState.dotMarkers.forEach(function(m) { sharedMap.removeLayer(m); });
  measureState.dotMarkers = []; measureState.points = [];
}

// 지도 이동 + 마커
function moveMapTo(lat, lng, label) {
  sharedMap.setView([lat, lng], 17);
  if (currentMarker) sharedMap.removeLayer(currentMarker);
  currentMarker = L.marker([lat, lng]).addTo(sharedMap);
  currentMarker.bindPopup('<div style="font-size:11px;white-space:nowrap;">' + label + '</div>').openPopup();
  document.getElementById('map-addr-badge').textContent = label;
}

// ── 행안부 주소검색 API ───────────────────────────────
function jusoSearch(keyword, callback) {
  var url = 'https://business.juso.go.kr/addrlink/addrLinkApi.do'
    + '?confmKey=' + JUSO_KEY
    + '&currentPage=1&countPerPage=1'
    + '&keyword=' + encodeURIComponent(keyword)
    + '&resultType=json&addInfoYn=N';
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var list = d && d.results && d.results.juso;
      if (list && list.length > 0) callback(list[0], null);
      else callback(null, '검색 결과가 없습니다.');
    })
    .catch(function(e) { callback(null, e.message); });
}

// ── Nominatim Geocoding ───────────────────────────────
function nominatimGeocode(query, zipNo, callback) {
  var url = 'https://nominatim.openstreetmap.org/search'
    + '?format=json&limit=3&countrycodes=kr&addressdetails=1'
    + '&q=' + encodeURIComponent('대한민국 ' + query);
  if (zipNo) url += '&postalcode=' + zipNo;
  fetch(url, { headers: { 'Accept-Language': 'ko' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var kr = (data || []).filter(function(r) { return r.address && r.address.country_code === 'kr'; });
      var best = kr.length > 0 ? kr[0] : (data && data[0]);
      if (best) callback(parseFloat(best.lat), parseFloat(best.lon));
      else callback(null, null);
    })
    .catch(function() { callback(null, null); });
}

// ── 주소 → PNU저장 + Geocoding ────────────────────────
function resolveAddress(road, jibun, blockId, onSuccess, onFail) {
  jusoSearch(road || jibun, function(juso) {
    if (juso && juso.admCd) {
      pnuStore[blockId] = juso.admCd
        + juso.mtYn
        + String(juso.lnbrMnnm).padStart(4, '0')
        + String(juso.lnbrSlno).padStart(4, '0');
    }
    var geoAddr = (juso && juso.roadAddrPart1) || road || jibun;
    var zipNo   = (juso && juso.zipNo) || '';

    nominatimGeocode(geoAddr, zipNo, function(lat, lng) {
      if (lat && lng) { onSuccess(lat, lng); return; }
      nominatimGeocode(jibun, zipNo, function(lat2, lng2) {
        if (lat2 && lng2) { onSuccess(lat2, lng2); return; }
        var rough = (road || jibun).split(' ').slice(0, 3).join(' ');
        nominatimGeocode(rough, '', function(lat3, lng3) {
          if (lat3 && lng3) onSuccess(lat3, lng3);
          else onFail();
        });
      });
    });
  });
}

// ── 토지이음 필지 직접 이동 ───────────────────────────
function openEum(id) {
  var pnu = pnuStore[id] || '';
  var form = document.createElement('form');
  form.method = 'post';
  form.action = 'https://www.eum.go.kr/web/ar/lu/luLandDet.jsp';
  form.target = '_blank';
  var inp = document.createElement('input');
  inp.type = 'hidden'; inp.name = 'pnu'; inp.value = pnu;
  form.appendChild(inp);
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}

// ── 주소 검색 ─────────────────────────────────────────
function openAddressSearch(id) {
  new daum.Postcode({
    oncomplete: function(data) {
      var road  = data.roadAddress || '';
      var jibun = data.jibunAddress || data.autoJibunAddress || '';
      var display = jibun || road;

      var addrEl = document.getElementById('addr-display-' + id);
      if (addrEl) { addrEl.textContent = display; addrEl.classList.remove('empty'); }

      var nm = document.getElementById('name-' + id);
      if (nm && !nm.value) nm.value = (data.bname || '') + ' ' + (data.jibun || '');

      // 주소 복사 버튼 data 업데이트
      var copyBtn = document.getElementById('copy-btn-' + id);
      if (copyBtn) copyBtn.dataset.addr = display;

      document.getElementById('map-addr-badge').textContent = '검색 중...';

      resolveAddress(road, jibun, id,
        function(lat, lng) {
          var label = (data.bname || '') + ' ' + (data.jibun || '');
          moveMapTo(lat, lng, label);
          // 카드 활성화
          setActiveBlock(id);
        },
        function() {
          document.getElementById('map-addr-badge').textContent = '좌표 검색 실패 — ' + display;
        }
      );
    }
  }).open();
}

function setActiveBlock(id) {
  activeBlockId = id;
  document.querySelectorAll('.block-card').forEach(function(c) { c.classList.remove('active'); });
  var card = document.getElementById('block-' + id);
  if (card) card.classList.add('active');
}

// ── 지번→도로명 변환 ──────────────────────────────────
function convertToRoad(keyword, onSuccess, onFail) {
  jusoSearch(keyword, function(juso, err) {
    if (juso && juso.roadAddr) { onSuccess(juso.roadAddr); return; }
    onFail(err || '검색 결과가 없습니다.');
  });
}

function runConvert(id) {
  var input   = document.getElementById('conv-input-' + id);
  var result  = document.getElementById('conv-result-' + id);
  var copyBtn = document.getElementById('conv-copy-' + id);
  var q = input && input.value.trim();
  if (!q) return;

  result.className = 'converter-result';
  result.textContent = '변환 중...';
  result.style.display = 'block';
  copyBtn.className = 'converter-copy';

  convertToRoad(q, function(roadAddr) {
    result.className = 'converter-result ok';
    result.textContent = roadAddr;
    copyBtn.className = 'converter-copy show';
    copyBtn.onclick = function() {
      navigator.clipboard.writeText(roadAddr).then(function() {
        copyBtn.textContent = '복사됨 ✓';
        setTimeout(function() { copyBtn.textContent = '도로명 복사'; }, 1500);
      }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = roadAddr; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        copyBtn.textContent = '복사됨 ✓';
        setTimeout(function() { copyBtn.textContent = '도로명 복사'; }, 1500);
      });
    };
  }, function(errMsg) {
    result.className = 'converter-result err';
    result.textContent = errMsg || '변환 실패';
    copyBtn.className = 'converter-copy';
  });
}

function copyAddr(id) {
  var btn  = document.getElementById('copy-btn-' + id);
  var addr = (btn && btn.dataset.addr) || '';
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(function() {
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '복사됨 ✓';
    setTimeout(function() { btn.textContent = '주소 복사'; }, 1500);
  });
}

// ── 용도지역 → 건폐율 ────────────────────────────────
var ZONE_BCR = {
  '50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,
  '60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,
  '60_ie':60,'60_ig':60,'60_is':60,
  '20_gb':20,'20_gp':20,'20_gn':20
};

function applyZoneBCR(id) {
  var sel  = document.getElementById('zone-sel-' + id);
  var wrap = document.getElementById('bcr-wrap-' + id);
  if (!sel) return;
  if (sel.value === 'custom') { if (wrap) wrap.style.display = 'block'; return; }
  if (wrap) wrap.style.display = 'none';
  var bcr = ZONE_BCR[sel.value];
  if (bcr !== undefined) { document.getElementById('bcr-' + id).value = bcr; calc(id); }
}

function applyCustomBCR(id) {
  var val = parseFloat(document.getElementById('bcr-custom-' + id).value) || 0;
  document.getElementById('bcr-' + id).value = val; calc(id);
}

// ── 구역 카드 ─────────────────────────────────────────

        + '<a class="link-btn" href="https://urban.seoul.go.kr/view/map/main.html" target="_blank">서울도시공간포털 ↗</a>'

        + '<input class="converter-input" type="text" id="conv-input-' + id + '" placeholder="지번 입력 (예: 역삼동 689-14)"'
        + ' onkeydown="if(event.key===\'Enter\')runConvert(' + id + ')">'

      + '</div>'
      + '<div class="converter-result" id="conv-result-' + id + '"></div>'
      + '<button class="converter-copy" id="conv-copy-' + id + '">도로명 복사</button>'

      + '<div class="input-section-label">공통</div>'
      + '<div class="inputs-grid-3">'
        + '<div class="input-field"><label>대지면적 (㎡)</label><input type="number" id="area-' + id + '" placeholder="입력" oninput="calc(' + id + ')"></div>'
        + '<div class="input-field"><label>용도지역</label>'

            + '<option value="">— 선택 —</option>'
            + '<option value="50">제1종전용 (50%)</option>'
            + '<option value="40">제2종전용 (40%)</option>'
            + '<option value="60_1">제1종일반 (60%)</option>'
            + '<option value="60_2">제2종일반 (60%)</option>'
            + '<option value="50_3">제3종일반 (50%)</option>'
            + '<option value="60_j">준주거 (60%)</option>'
            + '<option value="60_cs">중심상업 (60%)</option>'
            + '<option value="60_cg">일반상업 (60%)</option>'
            + '<option value="60_cn">근린상업 (60%)</option>'
            + '<option value="60_cd">유통상업 (60%)</option>'

            + '<option value="60_ig">일반공업 (60%)</option>'
            + '<option value="60_is">준공업 (60%)</option>'
            + '<option value="20_gb">보전녹지 (20%)</option>'
            + '<option value="20_gp">생산녹지 (20%)</option>'
            + '<option value="20_gn">자연녹지 (20%)</option>'

        + '<div class="input-field"><label>획지깊이 (자동)</label><input type="number" id="depth-l-' + id + '" readonly class="readonly-input"></div>'

      + '<hr class="divider">'

        + '<div class="metric"><div class="metric-label">바닥면적</div><div class="metric-value" id="r-floor-' + id + '">—</div></div>'
        + '<div class="metric"><div class="metric-label">체적</div><div class="metric-value" id="r-vol-' + id + '">—</div></div>'

function removeBlock(id) {
  blocks = blocks.filter(function(b) { return b !== id; });
  delete pnuStore[id];
  var el = document.getElementById('block-' + id); if (el) el.remove();
  if (activeBlockId === id) activeBlockId = blocks.length > 0 ? blocks[blocks.length - 1] : null;
  updateSummary();
}

// ── 계산 ─────────────────────────────────────────────
function v(eid) { var el = document.getElementById(eid); return el ? parseFloat(el.value) || 0 : 0; }

function calcSide(road, front, width, rear) {
  var depth = width - front;
  var minPt = (road + front) * 1.5;
  var maxPt = (road + front + depth - rear) * 1.5;
  return { depth: depth, minPt: minPt, maxPt: maxPt, avgPt: (minPt + maxPt) / 2 };
}

function calc(id) {
  var area = v('area-' + id), bcr = v('bcr-' + id) / 100, rear = v('rear-' + id);
  var rs = calcSide(v('road-s-' + id), v('front-s-' + id), v('width-s-' + id), rear);
  var rl = calcSide(v('road-l-' + id), v('front-l-' + id), v('width-l-' + id), rear);

  var ds = document.getElementById('depth-s-' + id);
  var dl = document.getElementById('depth-l-' + id);
  if (ds) ds.value = rs.depth > 0 ? rs.depth.toFixed(1) : '';
  if (dl) dl.value = rl.depth > 0 ? rl.depth.toFixed(1) : '';

  var hasLong = v('road-l-' + id) > 0 || v('width-l-' + id) > 0;
  var minVal, dMin, dMax, dAvg;
  if (hasLong && rl.avgPt > 0) {
    minVal = Math.min(rs.avgPt, rl.avgPt);
    dMin = Math.min(rs.minPt, rl.minPt);
    dMax = Math.max(rs.maxPt, rl.maxPt);
    dAvg = (rs.avgPt + rl.avgPt) / 2;
  } else {
    minVal = rs.avgPt; dMin = rs.minPt; dMax = rs.maxPt; dAvg = rs.avgPt;
  }

  var floor = area * bcr, vol = floor * minVal;
  var fmt  = function(n) { return n > 0 ? n.toFixed(1) : '—'; };
  var fmt0 = function(n) { return n > 0 ? Math.round(n).toLocaleString() : '—'; };
  var u    = function(s) { return '<span class="metric-unit">' + s + '</span>'; };

  document.getElementById('r-min-'    + id).innerHTML = fmt(dMin)   + (dMin   > 0 ? u('m')  : '');
  document.getElementById('r-max-'    + id).innerHTML = fmt(dMax)   + (dMax   > 0 ? u('m')  : '');
  document.getElementById('r-avg-'    + id).innerHTML = fmt(dAvg)   + (dAvg   > 0 ? u('m')  : '');
  document.getElementById('r-minval-' + id).innerHTML = fmt(minVal) + (minVal > 0 ? u('m')  : '');
  document.getElementById('r-floor-'  + id).innerHTML = fmt(floor)  + (floor  > 0 ? u('㎡') : '');
  document.getElementById('r-vol-'    + id).innerHTML = fmt0(vol)   + (vol    > 0 ? u('㎡') : '');
  updateSummary();
}

function updateSummary() {
  var tF = 0, tV = 0, valid = false;
  blocks.forEach(function(id) {
    var area = v('area-' + id), bcr = v('bcr-' + id) / 100, rear = v('rear-' + id);
    var rs = calcSide(v('road-s-' + id), v('front-s-' + id), v('width-s-' + id), rear);
    var rl = calcSide(v('road-l-' + id), v('front-l-' + id), v('width-l-' + id), rear);
    var hasLong = v('road-l-' + id) > 0 || v('width-l-' + id) > 0;
    var minVal = (hasLong && rl.avgPt > 0) ? Math.min(rs.avgPt, rl.avgPt) : rs.avgPt;
    var floor = area * bcr, vol = floor * minVal;
    if (area > 0 && minVal > 0) { tF += floor; tV += vol; valid = true; }
  });
  var avgH = tF > 0 ? tV / tF : 0;
  document.getElementById('avg-height').textContent = valid ? avgH.toFixed(1) : '—';
  document.getElementById('sum-vol').textContent = valid ? Math.round(tV).toLocaleString() + ' ㎡' : '—';
}

addBlock();
