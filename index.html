<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0ede8;
  --surface: #ffffff;
  --border: #d4d0c8;
  --border-light: #e4e0d8;
  --text: #111111;        /* 검정에 가까운 텍스트 */
  --text-sub: #333333;
  --text-hint: #888888;
  --accent: #1a4fd6;
  --accent-bg: #e8eefb;
  --danger: #c0392b;
  --warn: #8a4000;
  --warn-bg: #fff3e0;
}
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; /* 기본 폰트 사이즈 업 */
}

/* ══════════════════════════════════════
   1. 최상단: 블록평균높이 (가장 핵심)
══════════════════════════════════════ */
.top-bar {
  background: var(--accent);
  padding: 0 20px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.top-bar-title { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.75); letter-spacing: 0.04em; }
.top-summary { display: flex; align-items: center; gap: 28px; }
.top-metric { display: flex; align-items: baseline; gap: 6px; }
.top-metric-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.06em; }
.top-metric-value { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; color: #ffffff; line-height: 1; }
.top-metric-unit { font-size: 13px; color: rgba(255,255,255,0.75); }
.top-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.25); }
.top-right { display: flex; align-items: center; gap: 10px; }
.add-btn {
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 600;
  color: var(--accent); background: #ffffff;
  border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer;
}
.add-btn:hover { background: #f0f4ff; }

/* ══════════════════════════════════════
   2. 메인 레이아웃: 좌(지도) + 우(구역)
══════════════════════════════════════ */
.main {
  display: grid;
  grid-template-columns: 1fr 2fr;
  height: calc(100vh - 56px);
  overflow: hidden;
}

/* ── 좌측: 지도 패널 ── */
.map-panel { display: flex; flex-direction: column; border-right: 2px solid var(--border); overflow: hidden; background: var(--surface); }

/* [2번] 주소검색 + 외부링크 — 지도 위 툴바 */
.map-topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: #f7f5f0; border-bottom: 1px solid var(--border);
  flex-shrink: 0; flex-wrap: wrap;
}
.map-topbar-label { font-size: 12px; color: var(--text-hint); white-space: nowrap; }
.map-target-sel {
  font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 8px; outline: none; cursor: pointer;
}
.map-search-btn {
  font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 600;
  color: #fff; background: var(--accent); border: none; border-radius: 5px;
  padding: 6px 14px; cursor: pointer; white-space: nowrap;
}
.map-search-btn:hover { opacity: 0.85; }
.map-ext-btn {
  font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500;
  padding: 5px 11px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-sub); cursor: pointer;
  text-decoration: none; white-space: nowrap; display: inline-block;
}
.map-ext-btn:hover { background: var(--bg); color: var(--text); }
.map-addr-badge {
  font-size: 11px; color: var(--text-hint); font-family: 'DM Mono', monospace;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 4px 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}

/* 지도 */
#shared-map { flex: 1; min-height: 0; }

/* 지도 하단 툴바 */
.map-toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
/* [6번] 거리재기 버튼 크게 */
.tool-btn {
  font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 600;
  padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-sub); cursor: pointer; white-space: nowrap;
}
.tool-btn:hover { background: var(--bg); color: var(--text); }
.tool-btn.active { background: var(--warn-bg); color: var(--warn); border-color: #e0a060; }
.tool-btn.layer-on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
.map-badge-small { font-size: 11px; color: var(--text-hint); font-family: 'DM Mono', monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* [3번] 거리재기 결과 — 크고 선명하게 */
.measure-bar {
  display: none; width: 100%;
  padding: 8px 12px; margin-top: 3px;
  background: var(--warn-bg); border: 2px solid #e0a060; border-radius: 6px;
  font-size: 15px; font-weight: 700; font-family: 'DM Mono', monospace;
  color: var(--warn);
}
.measure-bar.show { display: block; }

/* ══════════════════════════════════════
   3. 우측: 구역 목록
══════════════════════════════════════ */
.blocks-panel { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
/* [8번] 반드시 스크롤 가능 */
.blocks-scroll {
  flex: 1; overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}

/* ── 구역 카드 ── */
.block-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  flex-shrink: 0; /* 절대 찌그러지지 않도록 */
}

/* 카드 헤더 */
.bc-head {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; background: #f5f3ee;
  border-bottom: 1px solid var(--border-light);
}
.bc-num {
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600;
  color: #fff; background: var(--accent);
  border-radius: 4px; padding: 2px 7px; flex-shrink: 0;
}
.bc-name {
  font-size: 13px; font-weight: 600; color: var(--text);
  border: none; background: transparent; outline: none; flex: 1; min-width: 0;
  font-family: 'Noto Sans KR', sans-serif;
}
.bc-name::placeholder { color: var(--text-hint); font-weight: 400; }
.bc-addr-badge {
  font-size: 11px; color: var(--text-hint); font-family: 'DM Mono', monospace;
  max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0;
}
.bc-del {
  font-size: 11px; color: var(--text-hint); background: none;
  border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 7px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0;
}
.bc-del:hover { color: var(--danger); border-color: var(--danger); }

/* 카드 바디 */
.bc-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

/* 섹션 레이블 */
.bc-sec {
  font-size: 11px; font-weight: 700; color: var(--text-hint);
  letter-spacing: 0.06em; text-transform: uppercase;
  display: flex; align-items: center; gap: 4px; margin-top: 2px;
}
.bc-sec::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

/* 입력 그리드 */
.bc-row { display: grid; gap: 6px; align-items: end; }
.bc-row.r3 { grid-template-columns: repeat(3, 1fr); }
.bc-row.r4 { grid-template-columns: repeat(4, 1fr); }
.bc-field { display: flex; flex-direction: column; gap: 2px; }
.bc-field label {
  font-size: 11px; font-weight: 500; color: var(--text-sub); /* [5번] 더 진하게 */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bc-field input, .bc-field select {
  font-family: 'Noto Sans KR', monospace; font-size: 12px; /* [5번] 폰트 업 */
  color: var(--text); /* [5번] 검정 */
  background: #faf9f6; border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 6px; outline: none; width: 100%;
}
.bc-field input:focus, .bc-field select:focus {
  border-color: var(--accent); background: var(--surface);
  box-shadow: 0 0 0 2px rgba(26,79,214,0.1);
}
.bc-field input[readonly] { background: #f0ede8 !important; color: var(--text-hint); }

/* 결과 스트립 */
.bc-results {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
  margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border-light);
}
.bc-metric { background: var(--bg); border-radius: 5px; padding: 5px 6px; }
.bc-metric-label { font-size: 10px; font-weight: 500; color: var(--text-hint); margin-bottom: 2px; }
.bc-metric-value {
  font-size: 14px; font-weight: 700; /* [5번] 크게, 굵게 */
  font-family: 'DM Mono', monospace; color: var(--text);
}
.bc-metric-value.hi { color: var(--accent); }
.bc-metric-unit { font-size: 9px; color: var(--text-hint); }

.bcr-wrap { display: none; margin-top: 3px; }
</style>
</head>
<body>

<!-- ① 최상단: 블록평균높이 강조 -->
<div class="top-bar">
  <div>
    <div class="top-bar-title">블록별 최고높이 검토 · 도로사선 기반</div>
  </div>
  <div class="top-summary">
    <div class="top-metric">
      <span class="top-metric-label">블록평균높이</span>
      <span class="top-metric-value" id="avg-height">—</span>
      <span class="top-metric-unit">m</span>
    </div>
    <div class="top-divider"></div>
    <div class="top-metric">
      <span class="top-metric-label">총 체적</span>
      <span class="top-metric-value" id="sum-vol" style="font-size:20px;">—</span>
      <span class="top-metric-unit">㎡</span>
    </div>
    <div class="top-divider"></div>
    <div class="top-metric">
      <span class="top-metric-label">구역</span>
      <span class="top-metric-value" id="block-count" style="font-size:20px;">0</span>
      <span class="top-metric-unit">개</span>
    </div>
  </div>
  <div class="top-right">
    <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
  </div>
</div>

<!-- ② 메인 -->
<div class="main">

  <!-- 좌측: 지도 패널 -->
  <div class="map-panel">

    <!-- [2번] 지도 위 툴바: 주소검색 + 외부링크 -->
    <div class="map-topbar">
      <span class="map-topbar-label">구역</span>
      <select class="map-target-sel" id="target-sel">
        <option value="">— 선택 —</option>
      </select>
      <button class="map-search-btn" onclick="openHeaderSearch()">📍 주소 검색</button>
      <div class="map-addr-badge" id="header-addr-badge">검색 결과 표시</div>
      <!-- [3번] 외부 링크 -->
      <a class="map-ext-btn" href="https://www.eum.go.kr/web/am/amMain.jsp" target="_blank">토지이음 ↗</a>
      <a class="map-ext-btn" href="https://urban.seoul.go.kr/view/map/main.html" target="_blank">서울도시공간포털 ↗</a>
    </div>

    <div id="shared-map"></div>

    <div class="map-toolbar">
      <button class="tool-btn layer-on" id="cadastral-btn">지적도 ON</button>
      <button class="tool-btn" id="measure-btn" style="min-width:90px;">📏 거리재기</button>
      <button class="tool-btn" id="reset-btn">초기화</button>
      <span class="map-badge-small" id="map-badge">주소 검색 시 이동</span>
      <div class="measure-bar" id="measure-bar"></div>
    </div>
  </div>

  <!-- 우측: 구역 목록 (스크롤 가능) -->
  <div class="blocks-panel">
    <div class="blocks-scroll" id="blocks-container"></div>
  </div>

</div>

<script>
var VKEY       = 'FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
var JUSO_KEY   = 'U01TX0FVVEgyMDI2MDQwNzE0MzkwODExNzg2NTc=';
var KAKAO_REST = '04dfcd40ee2cd4c572be4a581523fb54';
var blockCount = 0, blocks = [], pnuStore = {};

// ── 공유 지도 ─────────────────────────────────────────
var sharedMap = L.map('shared-map', { center: [37.5665, 126.9780], zoom: 12 });
L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/' + VKEY + '/Base/{z}/{y}/{x}.png',
  { attribution: '© VWorld', maxZoom: 19 }).addTo(sharedMap);
var cadastralLayer = L.tileLayer.wms('https://api.vworld.kr/req/wms', {
  layers: 'lt_c_landinfobasemap', styles: '', format: 'image/png',
  transparent: true, version: '1.3.0', key: VKEY, maxZoom: 19
}).addTo(sharedMap);

var cadastralOn = true, currentMarker = null;
new ResizeObserver(function() { sharedMap.invalidateSize({ animate: false }); })
  .observe(document.getElementById('shared-map'));

var ms = { on:false, points:[], dots:[], polyline:null, preview:null, clickFn:null, moveFn:null, ctxFn:null };

document.getElementById('cadastral-btn').onclick = function() {
  if (cadastralOn) { sharedMap.removeLayer(cadastralLayer); cadastralOn=false; this.classList.remove('layer-on'); this.textContent='지적도'; }
  else { cadastralLayer.addTo(sharedMap); cadastralOn=true; this.classList.add('layer-on'); this.textContent='지적도 ON'; }
};

function stopMeasure() {
  if (!ms.on) return; ms.on=false;
  var btn=document.getElementById('measure-btn');
  btn.classList.remove('active'); btn.textContent='📏 거리재기';
  sharedMap.off('click',ms.clickFn); sharedMap.off('mousemove',ms.moveFn);
  if (ms.ctxFn) sharedMap.getContainer().removeEventListener('contextmenu',ms.ctxFn);
  sharedMap.getContainer().style.cursor='';
  if (ms.preview) { sharedMap.removeLayer(ms.preview); ms.preview=null; }
}

document.getElementById('measure-btn').onclick = function() {
  var res=document.getElementById('measure-bar');
  if (ms.on) { stopMeasure(); return; }
  clearMeasure(); ms.on=true;
  this.classList.add('active'); this.textContent='⏹ 측정 종료';
  res.className='measure-bar'; sharedMap.getContainer().style.cursor='crosshair';

  ms.clickFn = function(e) {
    ms.points.push(e.latlng);
    ms.dots.push(L.circleMarker(e.latlng, { radius:5, color:'#8a4000', fillColor:'#fff', fillOpacity:1, weight:2 }).addTo(sharedMap));
    if (ms.polyline) sharedMap.removeLayer(ms.polyline);
    if (ms.points.length >= 2) {
      ms.polyline = L.polyline(ms.points, { color:'#8a4000', weight:3, opacity:1 }).addTo(sharedMap);
      var dist=0;
      for (var i=1;i<ms.points.length;i++) dist+=ms.points[i-1].distanceTo(ms.points[i]);
      res.className='measure-bar show';
      res.textContent = dist.toFixed(1)+' m  ·  '+(ms.points.length-1)+'구간   ← 우클릭하면 종료';
    }
  };
  ms.moveFn = function(e) {
    if (!ms.points.length) return;
    if (ms.preview) sharedMap.removeLayer(ms.preview);
    ms.preview = L.polyline([ms.points[ms.points.length-1], e.latlng], { color:'#8a4000', weight:2, opacity:0.5, dashArray:'6 4' }).addTo(sharedMap);
  };
  ms.ctxFn = function(e) { e.preventDefault(); stopMeasure(); };
  sharedMap.on('click',ms.clickFn); sharedMap.on('mousemove',ms.moveFn);
  sharedMap.getContainer().addEventListener('contextmenu',ms.ctxFn);
};

document.getElementById('reset-btn').onclick = function() {
  stopMeasure(); clearMeasure();
  document.getElementById('measure-bar').className='measure-bar';
};

function clearMeasure() {
  if (ms.polyline) { sharedMap.removeLayer(ms.polyline); ms.polyline=null; }
  if (ms.preview)  { sharedMap.removeLayer(ms.preview);  ms.preview=null;  }
  ms.dots.forEach(function(d){sharedMap.removeLayer(d);}); ms.dots=[]; ms.points=[];
}

function moveMap(lat, lng, label) {
  sharedMap.setView([lat,lng], 17);
  if (currentMarker) sharedMap.removeLayer(currentMarker);
  currentMarker = L.marker([lat,lng]).addTo(sharedMap);
  currentMarker.bindPopup('<div style="font-size:12px;font-weight:600;">'+label+'</div>').openPopup();
  document.getElementById('map-badge').textContent = label;
  document.getElementById('header-addr-badge').textContent = label;
}

// ── Geocoding ─────────────────────────────────────────
function kakaoGeocode(query, cb) {
  fetch('https://dapi.kakao.com/v2/local/search/address.json?query='+encodeURIComponent(query), {
    headers: { 'Authorization':'KakaoAK '+KAKAO_REST, 'KA':'sdk/1.0 os/javascript origin/https://jensurban1.github.io' }
  })
  .then(function(r){return r.json();})
  .then(function(d){ var doc=d.documents&&d.documents[0]; cb(doc?parseFloat(doc.y):null, doc?parseFloat(doc.x):null); })
  .catch(function(){cb(null,null);});
}

function jusoSearch(kw, cb) {
  fetch('https://business.juso.go.kr/addrlink/addrLinkApi.do?confmKey='+JUSO_KEY
    +'&currentPage=1&countPerPage=1&keyword='+encodeURIComponent(kw)+'&resultType=json&addInfoYn=N')
    .then(function(r){return r.json();})
    .then(function(d){var l=d&&d.results&&d.results.juso; cb(l&&l.length?l[0]:null);})
    .catch(function(){cb(null);});
}

function resolveAddr(road, jibun, blockId, onOk, onFail) {
  jusoSearch(road||jibun, function(juso) {
    if (juso&&juso.admCd) {
      pnuStore[blockId]=juso.admCd+juso.mtYn
        +String(juso.lnbrMnnm).padStart(4,'0')+String(juso.lnbrSlno).padStart(4,'0');
    }
  });
  kakaoGeocode(jibun||road, function(la,lo) {
    if (la&&lo) { onOk(la,lo); return; }
    kakaoGeocode(road, function(la2,lo2) {
      if (la2&&lo2) { onOk(la2,lo2); return; }
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='
        +encodeURIComponent('대한민국 '+(road||jibun)), {headers:{'Accept-Language':'ko'}})
        .then(function(r){return r.json();})
        .then(function(d){ if(d&&d[0]) onOk(parseFloat(d[0].lat),parseFloat(d[0].lon)); else onFail(); })
        .catch(onFail);
    });
  });
}

// ── 주소 검색 ─────────────────────────────────────────
function openHeaderSearch() {
  var targetId=parseInt(document.getElementById('target-sel').value);
  if (!blocks.length) { alert('먼저 구역을 추가해 주세요.'); return; }
  if (!targetId) { alert('적용할 구역을 선택해 주세요.'); return; }
  new daum.Postcode({
    oncomplete: function(data) {
      var road=data.roadAddress||'', jibun=data.jibunAddress||data.autoJibunAddress||'';
      var display=jibun||road, label=((data.bname||'')+' '+(data.jibun||'')).trim();
      var badge=document.getElementById('bc-addr-'+targetId);
      if (badge) badge.textContent=display;
      var nm=document.getElementById('bc-name-'+targetId);
      if (nm&&!nm.value) nm.value=label;
      document.getElementById('header-addr-badge').textContent='검색 중...';
      resolveAddr(road,jibun,targetId,
        function(la,lo){moveMap(la,lo,label);},
        function(){document.getElementById('header-addr-badge').textContent='좌표 검색 실패';});
    }
  }).open();
}

// ── 용도지역 ─────────────────────────────────────────
var ZONE_BCR={
  '50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,
  '60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,
  '60_ie':60,'60_ig':60,'60_is':60,
  '20_gb':20,'20_gp':20,'20_gn':20
};
function applyZone(id) {
  var sel=document.getElementById('bc-zone-'+id), wrap=document.getElementById('bc-bcr-wrap-'+id);
  if (!sel) return;
  if (sel.value==='custom'){if(wrap)wrap.style.display='block';return;}
  if(wrap)wrap.style.display='none';
  var bcr=ZONE_BCR[sel.value];
  if(bcr!==undefined){document.getElementById('bc-bcr-'+id).value=bcr;calc(id);}
}
function applyCustom(id){
  document.getElementById('bc-bcr-'+id).value=parseFloat(document.getElementById('bc-bcr-custom-'+id).value)||0;calc(id);
}

// ── 구역 카드 ─────────────────────────────────────────
function addBlock() {
  blockCount++; var id=blockCount; blocks.push(id);
  var opt=document.createElement('option');
  opt.value=id; opt.textContent=String(id).padStart(2,'0')+' 구역'; opt.id='target-opt-'+id;
  document.getElementById('target-sel').appendChild(opt);
  document.getElementById('target-sel').value=id;

  var div=document.createElement('div');
  div.className='block-card'; div.id='block-'+id;
  div.innerHTML=
    '<div class="bc-head">'
      +'<span class="bc-num">'+String(id).padStart(2,'0')+'</span>'
      +'<input class="bc-name" type="text" placeholder="구역명 입력" id="bc-name-'+id+'">'
      +'<span class="bc-addr-badge" id="bc-addr-'+id+'">주소 미설정</span>'
      +'<button class="bc-del" onclick="removeBlock('+id+')">삭제</button>'
    +'</div>'
    +'<div class="bc-body">'
      +'<input type="hidden" id="bc-bcr-'+id+'" value="60">'

      +'<div class="bc-sec">공통</div>'
      +'<div class="bc-row r3">'
        +'<div class="bc-field"><label>대지면적 (㎡)</label><input type="number" id="bc-area-'+id+'" placeholder="입력" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>용도지역</label>'
          +'<select id="bc-zone-'+id+'" onchange="applyZone('+id+')">'
            +'<option value="">— 선택 —</option>'
            +'<option value="50">1종전용(50%)</option><option value="40">2종전용(40%)</option>'
            +'<option value="60_1">1종일반(60%)</option><option value="60_2">2종일반(60%)</option>'
            +'<option value="50_3">3종일반(50%)</option><option value="60_j">준주거(60%)</option>'
            +'<option value="60_cs">중심상업(60%)</option><option value="60_cg">일반상업(60%)</option>'
            +'<option value="60_cn">근린상업(60%)</option><option value="60_cd">유통상업(60%)</option>'
            +'<option value="60_ie">전용공업(60%)</option><option value="60_ig">일반공업(60%)</option>'
            +'<option value="60_is">준공업(60%)</option>'
            +'<option value="20_gb">보전녹지(20%)</option><option value="20_gp">생산녹지(20%)</option>'
            +'<option value="20_gn">자연녹지(20%)</option><option value="custom">직접입력</option>'
          +'</select>'
          +'<div class="bcr-wrap" id="bc-bcr-wrap-'+id+'"><input type="number" id="bc-bcr-custom-'+id+'" placeholder="건폐율%" oninput="applyCustom('+id+')"></div>'
        +'</div>'
        +'<div class="bc-field"><label>후면건축선후퇴 (m)</label><input type="number" id="bc-rear-'+id+'" value="0" oninput="calc('+id+')"></div>'
      +'</div>'

      +'<div class="bc-sec">단변</div>'
      +'<div class="bc-row r4">'
        +'<div class="bc-field"><label>전면도로폭 (m)</label><input type="number" id="bc-rs-'+id+'" placeholder="50" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>전면후퇴 (m)</label><input type="number" id="bc-fs-'+id+'" value="3" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>획지폭 (m)</label><input type="number" id="bc-ws-'+id+'" placeholder="24.6" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>획지깊이 (자동)</label><input type="number" id="bc-ds-'+id+'" readonly></div>'
      +'</div>'

      +'<div class="bc-sec">장변</div>'
      +'<div class="bc-row r4">'
        +'<div class="bc-field"><label>전면도로폭 (m)</label><input type="number" id="bc-rl-'+id+'" placeholder="50" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>전면후퇴 (m)</label><input type="number" id="bc-fl-'+id+'" value="3" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>획지폭 (m)</label><input type="number" id="bc-wl-'+id+'" placeholder="62" oninput="calc('+id+')"></div>'
        +'<div class="bc-field"><label>획지깊이 (자동)</label><input type="number" id="bc-dl-'+id+'" readonly></div>'
      +'</div>'

      +'<div class="bc-results">'
        +'<div class="bc-metric"><div class="bc-metric-label">최저점</div><div class="bc-metric-value" id="bc-rmin-'+id+'">—</div></div>'
        +'<div class="bc-metric"><div class="bc-metric-label">최고점</div><div class="bc-metric-value" id="bc-rmax-'+id+'">—</div></div>'
        +'<div class="bc-metric"><div class="bc-metric-label">평균점</div><div class="bc-metric-value" id="bc-ravg-'+id+'">—</div></div>'
        +'<div class="bc-metric"><div class="bc-metric-label">최솟값</div><div class="bc-metric-value hi" id="bc-rval-'+id+'">—</div></div>'
        +'<div class="bc-metric"><div class="bc-metric-label">바닥면적</div><div class="bc-metric-value" id="bc-rfloor-'+id+'">—</div></div>'
        +'<div class="bc-metric"><div class="bc-metric-label">체적</div><div class="bc-metric-value" id="bc-rvol-'+id+'">—</div></div>'
      +'</div>'
    +'</div>';

  document.getElementById('blocks-container').appendChild(div);
  updateSummary();
  // 새 카드로 스크롤
  div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function removeBlock(id) {
  blocks=blocks.filter(function(b){return b!==id;});
  delete pnuStore[id];
  var el=document.getElementById('block-'+id); if(el) el.remove();
  var opt=document.getElementById('target-opt-'+id); if(opt) opt.remove();
  updateSummary();
}

// ── 계산 ─────────────────────────────────────────────
function g(e){var el=document.getElementById(e);return el?parseFloat(el.value)||0:0;}
function side(road,front,width,rear){
  var d=width-front,mn=(road+front)*1.5,mx=(road+front+d-rear)*1.5;
  return{d:d,mn:mn,mx:mx,avg:(mn+mx)/2};
}
function calc(id){
  var area=g('bc-area-'+id),bcr=g('bc-bcr-'+id)/100,rear=g('bc-rear-'+id);
  var rs=side(g('bc-rs-'+id),g('bc-fs-'+id),g('bc-ws-'+id),rear);
  var rl=side(g('bc-rl-'+id),g('bc-fl-'+id),g('bc-wl-'+id),rear);
  var ds=document.getElementById('bc-ds-'+id),dl=document.getElementById('bc-dl-'+id);
  if(ds)ds.value=rs.d>0?rs.d.toFixed(1):'';
  if(dl)dl.value=rl.d>0?rl.d.toFixed(1):'';
  var hasL=g('bc-rl-'+id)>0||g('bc-wl-'+id)>0,minV,dMn,dMx,dAv;
  if(hasL&&rl.avg>0){minV=Math.min(rs.avg,rl.avg);dMn=Math.min(rs.mn,rl.mn);dMx=Math.max(rs.mx,rl.mx);dAv=(rs.avg+rl.avg)/2;}
  else{minV=rs.avg;dMn=rs.mn;dMx=rs.mx;dAv=rs.avg;}
  var floor=area*bcr,vol=floor*minV;
  var f1=function(n){return n>0?n.toFixed(1):'—';},f0=function(n){return n>0?Math.round(n).toLocaleString():'—';};
  var u=function(s){return '<span class="bc-metric-unit">'+s+'</span>';};
  document.getElementById('bc-rmin-'+id).innerHTML =f1(dMn) +(dMn >0?u('m'):'');
  document.getElementById('bc-rmax-'+id).innerHTML =f1(dMx) +(dMx >0?u('m'):'');
  document.getElementById('bc-ravg-'+id).innerHTML =f1(dAv) +(dAv >0?u('m'):'');
  document.getElementById('bc-rval-'+id).innerHTML =f1(minV)+(minV>0?u('m'):'');
  document.getElementById('bc-rfloor-'+id).innerHTML=f1(floor)+(floor>0?u('㎡'):'');
  document.getElementById('bc-rvol-'+id).innerHTML =f0(vol) +(vol >0?u('㎡'):'');
  updateSummary();
}
function updateSummary(){
  var tF=0,tV=0,ok=false;
  blocks.forEach(function(id){
    var area=g('bc-area-'+id),bcr=g('bc-bcr-'+id)/100,rear=g('bc-rear-'+id);
    var rs=side(g('bc-rs-'+id),g('bc-fs-'+id),g('bc-ws-'+id),rear);
    var rl=side(g('bc-rl-'+id),g('bc-fl-'+id),g('bc-wl-'+id),rear);
    var hasL=g('bc-rl-'+id)>0||g('bc-wl-'+id)>0;
    var minV=(hasL&&rl.avg>0)?Math.min(rs.avg,rl.avg):rs.avg;
    var floor=area*bcr,vol=floor*minV;
    if(area>0&&minV>0){tF+=floor;tV+=vol;ok=true;}
  });
  document.getElementById('avg-height').textContent=ok?(tF>0?tV/tF:0).toFixed(1):'—';
  document.getElementById('sum-vol').textContent=ok?Math.round(tV).toLocaleString():'—';
  document.getElementById('block-count').textContent=blocks.length;
}

addBlock();
</script>
