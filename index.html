<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블록별 최고높이 검토</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f3ef;--surface:#fff;--border:#e0ddd6;--border-light:#ece9e2;
  --text:#1a1916;--text-sub:#6b6860;--text-hint:#a09e98;
  --accent:#2d5be3;--accent-bg:#eef2fd;--accent-text:#1a3fa0;
  --danger:#c0392b;--warn:#b45309;--warn-bg:#fef3c7;
  --success:#1a7a4a;--success-bg:#eaf5ee;
}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;height:42px;flex-shrink:0;}
header h1{font-size:13px;font-weight:600;letter-spacing:-0.02em;}
header span{font-size:10px;color:var(--text-hint);font-family:'DM Mono',monospace;margin-left:10px;}
.add-btn{font-size:11px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--accent);background:var(--accent-bg);border:none;border-radius:5px;padding:5px 12px;cursor:pointer;}
.add-btn:hover{opacity:0.8;}
.page{display:flex;flex-direction:column;height:calc(100vh - 42px);}
/* 상단: 지도(1/3) + 구역카드(2/3) */
.top-row{display:grid;grid-template-columns:1fr 2fr;height:38vh;flex-shrink:0;border-bottom:1px solid var(--border);}
/* 지도 */
.map-panel{display:flex;flex-direction:column;border-right:1px solid var(--border);}
#shared-map{flex:1;min-height:0;}
.map-bar{display:flex;gap:5px;padding:5px 8px;background:var(--surface);border-top:1px solid var(--border-light);align-items:center;flex-wrap:wrap;flex-shrink:0;}
.tbtn{font-size:10px;font-family:'Noto Sans KR',sans-serif;font-weight:500;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);cursor:pointer;white-space:nowrap;}
.tbtn:hover{background:var(--bg);}
.tbtn.active{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
.tbtn.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent);}
.map-badge{font-size:10px;color:var(--text-hint);font-family:'DM Mono',monospace;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.minfo{font-size:10px;color:var(--warn);font-family:'DM Mono',monospace;display:none;}
.minfo.show{display:block;}
/* 구역 가로 스크롤 */
.blocks-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.blocks-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;gap:8px;padding:8px 10px;align-items:stretch;}
/* 카드 */
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:7px;width:210px;flex-shrink:0;display:flex;flex-direction:column;cursor:pointer;transition:border-color 0.12s;overflow:hidden;}
.bcard:hover{border-color:#b0b8d0;}
.bcard.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
.ch{display:flex;align-items:center;gap:4px;padding:5px 8px;background:#faf9f7;border-bottom:1px solid var(--border-light);}
.bnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-hint);background:var(--border-light);border-radius:3px;padding:1px 5px;flex-shrink:0;}
.bname{font-size:11px;font-weight:500;font-family:'Noto Sans KR',sans-serif;border:none;background:transparent;color:var(--text);outline:none;flex:1;min-width:0;}
.bname::placeholder{color:var(--text-hint);}
.rbtn{font-size:9px;color:var(--text-hint);background:none;border:none;cursor:pointer;padding:1px 4px;flex-shrink:0;}
.rbtn:hover{color:var(--danger);}
.cb{padding:6px 8px;flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.arow{display:flex;align-items:center;gap:4px;}
.atxt{font-size:10px;color:var(--text-sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.atxt.empty{color:var(--text-hint);font-style:italic;}
.xs{font-size:9px;font-family:'Noto Sans KR',sans-serif;padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;flex-shrink:0;}
.xs:hover{background:var(--bg);color:var(--text);}
.xs.p{background:var(--accent);color:#fff;border-color:var(--accent);}
.xs.p:hover{opacity:0.85;}
.lrow{display:flex;gap:3px;flex-wrap:wrap;}
.cvrow{display:flex;gap:3px;}
.cvi{flex:1;font-size:10px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:3px 5px;outline:none;min-width:0;}
.cvi:focus{border-color:var(--accent);background:var(--surface);}
.cvres{font-size:9px;line-height:1.4;padding:3px 5px;border-radius:3px;word-break:break-all;display:none;}
.cvres.ok{background:var(--success-bg);color:var(--success);display:block;}
.cvres.err{background:var(--warn-bg);color:var(--warn);display:block;}
.cvcopy{font-size:9px;font-family:'Noto Sans KR',sans-serif;margin-top:2px;padding:2px 5px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);cursor:pointer;width:100%;display:none;}
.cvcopy.show{display:block;}
.sl{font-size:8px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:3px;margin-top:2px;}
.sl::after{content:'';flex:1;height:1px;background:var(--border-light);}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.ifd{display:flex;flex-direction:column;gap:1px;}
.ifd label{font-size:8px;color:var(--text-hint);white-space:nowrap;}
input[type="number"],select{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:3px 4px;outline:none;width:100%;}
input[type="number"]:focus,select:focus{border-color:var(--accent);background:var(--surface);}
.ro{background:#f8f7f5!important;}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:2px;}
.met{background:var(--bg);border-radius:3px;padding:4px 5px;}
.ml{font-size:7px;color:var(--text-hint);margin-bottom:1px;}
.mv{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;}
.mv.hi{color:var(--accent);}
.mu{font-size:7px;color:var(--text-hint);}
.bcw{display:none;margin-top:2px;}
/* 하단 */
.bot{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.sbar{padding:7px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;flex-shrink:0;}
.si{display:flex;align-items:baseline;gap:5px;}
.slb{font-size:10px;color:var(--text-hint);}
.sv{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent);}
.su{font-size:10px;color:var(--text-hint);}
.twrap{flex:1;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;}
thead th{background:var(--surface);padding:5px 10px;text-align:left;font-size:9px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;white-space:nowrap;}
tbody td{padding:4px 10px;border-bottom:1px solid var(--border-light);font-family:'DM Mono',monospace;font-size:11px;white-space:nowrap;}
tbody tr:hover{background:var(--bg);}
tbody tr.ar td{background:var(--accent-bg);}
.tn{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:11px;color:var(--text);}
.th{color:var(--accent);font-weight:600;}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;">
    <h1>블록별 최고높이 검토</h1>
    <span>도로사선 기반 · 지구단위계획</span>
  </div>
  <button class="add-btn" onclick="addBlock()">+ 구역 추가</button>
</header>
<div class="page">
  <div class="top-row">
    <div class="map-panel">
      <div id="shared-map"></div>
      <div class="map-bar">
        <button class="tbtn on" id="cad-btn">지적도 ON</button>
        <button class="tbtn" id="msr-btn">거리재기</button>
        <button class="tbtn" id="rst-btn">초기화</button>
        <span class="map-badge" id="mbadge">주소 검색 시 지도 이동</span>
        <span class="minfo" id="minfo"></span>
      </div>
    </div>
    <div class="blocks-panel">
      <div class="blocks-scroll" id="bcon"></div>
    </div>
  </div>
  <div class="bot">
    <div class="sbar">
      <div class="si"><span class="slb">블록평균높이</span><span class="sv" id="avgh">—</span><span class="su">m</span></div>
      <div class="si"><span class="slb">총 체적</span><span class="sv" id="sumv" style="font-size:13px;">—</span><span class="su">㎡</span></div>
    </div>
    <div class="twrap">
      <table>
        <thead><tr>
          <th>#</th><th>구역명</th><th>대지(㎡)</th><th>용도지역</th>
          <th>최저점</th><th>최고점</th><th>평균점</th>
          <th>허용높이</th><th>바닥면적</th><th>체적</th>
        </tr></thead>
        <tbody id="stbl"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
var VKEY='FD876FCA-7CF2-38C7-B540-7A74F1A49B4E';
var JKEY='U01TX0FVVEgyMDI2MDQwNzE0MzkwODExNzg2NTc=';
var bc=0,blocks=[],aid=null,pnus={};

/* ── 지도 ── */
var map=L.map('shared-map',{center:[37.5665,126.9780],zoom:13});
L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/'+VKEY+'/Base/{z}/{y}/{x}.png',{attribution:'© VWorld',maxZoom:19}).addTo(map);
var cadL=L.tileLayer.wms('https://api.vworld.kr/req/wms',{layers:'lt_c_landinfobasemap',styles:'',format:'image/png',transparent:true,version:'1.3.0',key:VKEY,maxZoom:19}).addTo(map);
var cadOn=true,curMk=null;
var ms={on:false,pts:[],dots:[],poly:null,pre:null,cfn:null,mfn:null,rfn:null};

document.getElementById('cad-btn').onclick=function(){
  if(cadOn){map.removeLayer(cadL);cadOn=false;this.classList.remove('on');this.textContent='지적도';}
  else{cadL.addTo(map);cadOn=true;this.classList.add('on');this.textContent='지적도 ON';}
};

function stopMsr(){
  ms.on=false;
  var b=document.getElementById('msr-btn');b.classList.remove('active');b.textContent='거리재기';
  map.off('click',ms.cfn);map.off('mousemove',ms.mfn);
  map.getContainer().removeEventListener('contextmenu',ms.rfn);
  map.getContainer().style.cursor='';
  if(ms.pre){map.removeLayer(ms.pre);ms.pre=null;}
}
document.getElementById('msr-btn').onclick=function(){
  if(ms.on){stopMsr();return;}
  clrMsr();ms.on=true;
  this.classList.add('active');this.textContent='측정 종료 (우클릭=종료)';
  document.getElementById('minfo').className='minfo';
  map.getContainer().style.cursor='crosshair';
  ms.cfn=function(e){
    ms.pts.push(e.latlng);
    var d=L.circleMarker(e.latlng,{radius:4,color:'#b45309',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(map);
    ms.dots.push(d);
    if(ms.poly)map.removeLayer(ms.poly);
    if(ms.pts.length>=2){
      ms.poly=L.polyline(ms.pts,{color:'#b45309',weight:2.5,opacity:1}).addTo(map);
      var dist=0;for(var i=1;i<ms.pts.length;i++)dist+=ms.pts[i-1].distanceTo(ms.pts[i]);
      var mi=document.getElementById('minfo');mi.className='minfo show';
      mi.textContent=dist.toFixed(1)+' m ('+( ms.pts.length-1)+'구간) — 우클릭으로 종료';
    }
  };
  ms.mfn=function(e){
    if(!ms.pts.length)return;
    if(ms.pre)map.removeLayer(ms.pre);
    ms.pre=L.polyline([ms.pts[ms.pts.length-1],e.latlng],{color:'#b45309',weight:1.5,opacity:0.45,dashArray:'6 4'}).addTo(map);
  };
  /* [수정4] 우클릭 → 측정 종료 */
  ms.rfn=function(e){e.preventDefault();stopMsr();};
  map.on('click',ms.cfn);map.on('mousemove',ms.mfn);
  map.getContainer().addEventListener('contextmenu',ms.rfn);
};
document.getElementById('rst-btn').onclick=function(){
  if(ms.on)stopMsr();clrMsr();document.getElementById('minfo').className='minfo';
};
function clrMsr(){
  if(ms.poly){map.removeLayer(ms.poly);ms.poly=null;}
  if(ms.pre){map.removeLayer(ms.pre);ms.pre=null;}
  ms.dots.forEach(function(d){map.removeLayer(d);});ms.dots=[];ms.pts=[];
}
function mvMap(lat,lng,lbl){
  map.setView([lat,lng],17);
  if(curMk)map.removeLayer(curMk);
  curMk=L.marker([lat,lng]).addTo(map);
  curMk.bindPopup('<div style="font-size:11px;">'+lbl+'</div>').openPopup();
  document.getElementById('mbadge').textContent=lbl;
}

/* ── API ── */
function juso(kw,cb){
  fetch('https://business.juso.go.kr/addrlink/addrLinkApi.do?confmKey='+JKEY+'&currentPage=1&countPerPage=1&keyword='+encodeURIComponent(kw)+'&resultType=json&addInfoYn=N')
    .then(function(r){return r.json();})
    .then(function(d){var l=d&&d.results&&d.results.juso;cb(l&&l.length?l[0]:null);})
    .catch(function(){cb(null);});
}
function nom(q,zip,cb){
  var url='https://nominatim.openstreetmap.org/search?format=json&limit=3&countrycodes=kr&addressdetails=1&q='+encodeURIComponent('대한민국 '+q);
  if(zip)url+='&postalcode='+zip;
  fetch(url,{headers:{'Accept-Language':'ko'}})
    .then(function(r){return r.json();})
    .then(function(d){var kr=(d||[]).filter(function(r){return r.address&&r.address.country_code==='kr';});var b=kr[0]||(d&&d[0]);cb(b?parseFloat(b.lat):null,b?parseFloat(b.lon):null);})
    .catch(function(){cb(null,null);});
}
function resolve(road,jib,id,ok,fail){
  juso(road||jib,function(j){
    if(j&&j.admCd)pnus[id]=j.admCd+j.mtYn+String(j.lnbrMnnm).padStart(4,'0')+String(j.lnbrSlno).padStart(4,'0');
    var geo=(j&&j.roadAddrPart1)||road||jib,zip=(j&&j.zipNo)||'';
    nom(geo,zip,function(a,b){
      if(a&&b){ok(a,b);return;}
      nom(jib,zip,function(c,d){
        if(c&&d){ok(c,d);return;}
        nom((road||jib).split(' ').slice(0,3).join(' '),'',function(e,f){if(e&&f)ok(e,f);else fail();});
      });
    });
  });
}
function openAddr(id){
  new daum.Postcode({oncomplete:function(data){
    var road=data.roadAddress||'',jib=data.jibunAddress||data.autoJibunAddress||'',disp=jib||road;
    var ae=document.getElementById('at-'+id);if(ae){ae.textContent=disp;ae.classList.remove('empty');}
    var nm=document.getElementById('nm-'+id);if(nm&&!nm.value)nm.value=(data.bname||'')+' '+(data.jibun||'');
    var cb=document.getElementById('cbtn-'+id);if(cb)cb.dataset.addr=disp;
    document.getElementById('mbadge').textContent='검색 중...';
    resolve(road,jib,id,function(lat,lng){mvMap(lat,lng,(data.bname||'')+' '+(data.jibun||''));setAct(id);},function(){document.getElementById('mbadge').textContent='좌표 실패: '+disp;});
  }}).open();
}
function setAct(id){
  aid=id;
  document.querySelectorAll('.bcard').forEach(function(c){c.classList.remove('active');});
  document.querySelectorAll('tbody tr').forEach(function(r){r.classList.remove('ar');});
  var c=document.getElementById('bc-'+id);if(c)c.classList.add('active');
  var r=document.getElementById('tr-'+id);if(r)r.classList.add('ar');
}
function copyAddr(id){
  var b=document.getElementById('cbtn-'+id),addr=(b&&b.dataset.addr)||'';if(!addr)return;
  navigator.clipboard.writeText(addr).catch(function(){var ta=document.createElement('textarea');ta.value=addr;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);});
  b.textContent='복사✓';setTimeout(function(){b.textContent='주소복사';},1400);
}
function runCv(id){
  var inp=document.getElementById('cvi-'+id),res=document.getElementById('cvr-'+id),cp=document.getElementById('cvc-'+id);
  var q=inp&&inp.value.trim();if(!q)return;
  res.className='cvres';res.textContent='변환 중...';res.style.display='block';cp.className='cvcopy';
  juso(q,function(j){
    if(j&&j.roadAddr){res.className='cvres ok';res.textContent=j.roadAddr;cp.className='cvcopy show';cp.onclick=function(){navigator.clipboard.writeText(j.roadAddr).catch(function(){});cp.textContent='복사✓';setTimeout(function(){cp.textContent='도로명 복사';},1400);};}
    else{res.className='cvres err';res.textContent='검색 결과 없음';}
  });
}
var ZB={'50':50,'40':40,'60_1':60,'60_2':60,'50_3':50,'60_j':60,'60_cs':60,'60_cg':60,'60_cn':60,'60_cd':60,'60_ie':60,'60_ig':60,'60_is':60,'20_gb':20,'20_gp':20,'20_gn':20};
var ZN={'50':'1종전용','40':'2종전용','60_1':'1종일반','60_2':'2종일반','50_3':'3종일반','60_j':'준주거','60_cs':'중심상업','60_cg':'일반상업','60_cn':'근린상업','60_cd':'유통상업','60_ie':'전용공업','60_ig':'일반공업','60_is':'준공업','20_gb':'보전녹지','20_gp':'생산녹지','20_gn':'자연녹지','custom':'직접입력'};
function applyZone(id){
  var s=document.getElementById('zs-'+id),w=document.getElementById('bw-'+id);if(!s)return;
  if(s.value==='custom'){if(w)w.style.display='block';return;}
  if(w)w.style.display='none';var b=ZB[s.value];
  if(b!==undefined){document.getElementById('bcr-'+id).value=b;calc(id);}
}
function applyBcr(id){var v=parseFloat(document.getElementById('bci-'+id).value)||0;document.getElementById('bcr-'+id).value=v;calc(id);}

/* ── 카드 생성 ── */
function addBlock(){
  bc++;var id=bc;blocks.push(id);
  var div=document.createElement('div');div.className='bcard';div.id='bc-'+id;
  div.onclick=function(e){if(['INPUT','SELECT','BUTTON','A'].indexOf(e.target.tagName)>=0)return;setAct(id);};
  div.innerHTML=
    '<div class="ch">'
      +'<span class="bnum">'+String(id).padStart(2,'0')+'</span>'
      +'<input class="bname" type="text" placeholder="구역명" id="nm-'+id+'">'
      +'<button class="rbtn" onclick="rmBlock('+id+')" title="삭제">✕</button>'
    +'</div>'
    +'<div class="cb">'
      +'<div class="arow"><span class="atxt empty" id="at-'+id+'">미설정</span>'
        +'<button class="xs p" onclick="openAddr('+id+')">검색</button></div>'
      +'<div class="lrow">'
        +'<button class="xs" id="cbtn-'+id+'" onclick="copyAddr('+id+')">주소복사</button>'
        +'<a class="xs" href="https://www.eum.go.kr/web/am/amMain.jsp" target="_blank">토지이음 ↗</a>'
        +'<a class="xs" href="https://urban.seoul.go.kr/view/map/main.html" target="_blank">서울공간포털 ↗</a>'
      +'</div>'
      +'<div class="cvrow">'
        +'<input class="cvi" type="text" id="cvi-'+id+'" placeholder="지번→도로명" onkeydown="if(event.key===\'Enter\')runCv('+id+')">'
        +'<button class="xs" onclick="runCv('+id+')">변환</button>'
      +'</div>'
      +'<div class="cvres" id="cvr-'+id+'"></div>'
      +'<button class="cvcopy" id="cvc-'+id+'">도로명 복사</button>'
      +'<div class="sl">공통</div>'
      +'<input type="hidden" id="bcr-'+id+'" value="60">'
      +'<div class="g3">'
        +'<div class="ifd"><label>대지(㎡)</label><input type="number" id="area-'+id+'" placeholder="0" oninput="calc('+id+')"></div>'
        +'<div class="ifd"><label>용도지역</label>'
          +'<select id="zs-'+id+'" onchange="applyZone('+id+')">'
            +'<option value="">— 선택</option>'
            +'<option value="50">1종전용(50%)</option><option value="40">2종전용(40%)</option>'
            +'<option value="60_1">1종일반(60%)</option><option value="60_2">2종일반(60%)</option>'
            +'<option value="50_3">3종일반(50%)</option><option value="60_j">준주거(60%)</option>'
            +'<option value="60_cs">중심상업</option><option value="60_cg">일반상업</option>'
            +'<option value="60_cn">근린상업</option><option value="60_cd">유통상업</option>'
            +'<option value="60_ie">전용공업</option><option value="60_ig">일반공업</option><option value="60_is">준공업</option>'
            +'<option value="20_gb">보전녹지</option><option value="20_gp">생산녹지</option><option value="20_gn">자연녹지</option>'
            +'<option value="custom">직접입력</option>'
          +'</select>'
          +'<div class="bcw" id="bw-'+id+'"><input type="number" id="bci-'+id+'" placeholder="건폐율%" oninput="applyBcr('+id+')"></div>'
        +'</div>'
        +'<div class="ifd"><label>후면후퇴(m)</label><input type="number" id="rear-'+id+'" value="0" oninput="calc('+id+')"></div>'
      +'</div>'
      +'<div class="sl">단변</div>'
      +'<div class="g3">'
        +'<div class="ifd"><label>도로폭(m)</label><input type="number" id="rs-'+id+'" placeholder="0" oninput="calc('+id+')"></div>'
        +'<div class="ifd"><label>전면후퇴(m)</label><input type="number" id="fs-'+id+'" value="3" oninput="calc('+id+')"></div>'
        +'<div class="ifd"><label>획지폭(m)</label><input type="number" id="ws-'+id+'" placeholder="0" oninput="calc('+id+')"></div>'
      +'</div>'
      +'<div class="g2"><div class="ifd"><label>획지깊이(자동)</label><input type="number" id="ds-'+id+'" readonly class="ro"></div></div>'
      +'<div class="sl">장변</div>'
      +'<div class="g3">'
        +'<div class="ifd"><label>도로폭(m)</label><input type="number" id="rl-'+id+'" placeholder="0" oninput="calc('+id+')"></div>'
        +'<div class="ifd"><label>전면후퇴(m)</label><input type="number" id="fl-'+id+'" value="3" oninput="calc('+id+')"></div>'
        +'<div class="ifd"><label>획지폭(m)</label><input type="number" id="wl-'+id+'" placeholder="0" oninput="calc('+id+')"></div>'
      +'</div>'
      +'<div class="g2"><div class="ifd"><label>획지깊이(자동)</label><input type="number" id="dl-'+id+'" readonly class="ro"></div></div>'
      +'<div class="sl">결과</div>'
      +'<div class="res">'
        +'<div class="met"><div class="ml">최저점</div><div class="mv" id="rlo-'+id+'">—</div></div>'
        +'<div class="met"><div class="ml">최고점</div><div class="mv" id="rhi-'+id+'">—</div></div>'
        +'<div class="met"><div class="ml">평균점</div><div class="mv" id="rav-'+id+'">—</div></div>'
        +'<div class="met"><div class="ml">허용높이</div><div class="mv hi" id="rmv-'+id+'">—</div></div>'
        +'<div class="met"><div class="ml">바닥면적</div><div class="mv" id="rfl-'+id+'">—</div></div>'
        +'<div class="met"><div class="ml">체적</div><div class="mv" id="rvl-'+id+'">—</div></div>'
      +'</div>'
    +'</div>';
  document.getElementById('bcon').appendChild(div);
  setAct(id);upd();
}
function rmBlock(id){
  blocks=blocks.filter(function(b){return b!==id;});delete pnus[id];
  var el=document.getElementById('bc-'+id);if(el)el.remove();
  if(aid===id)aid=blocks.length?blocks[blocks.length-1]:null;upd();
}

/* ── 계산 ── */
function g(e){var el=document.getElementById(e);return el?parseFloat(el.value)||0:0;}
function side(r,f,w,rear){var d=w-f,lo=(r+f)*1.5,hi=(r+f+d-rear)*1.5;return{d:d,lo:lo,hi:hi,avg:(lo+hi)/2};}
function calc(id){
  var area=g('area-'+id),bcr=g('bcr-'+id)/100,rear=g('rear-'+id);
  var S=side(g('rs-'+id),g('fs-'+id),g('ws-'+id),rear);
  var L=side(g('rl-'+id),g('fl-'+id),g('wl-'+id),rear);
  var ds=document.getElementById('ds-'+id),dl=document.getElementById('dl-'+id);
  if(ds)ds.value=S.d>0?S.d.toFixed(1):'';if(dl)dl.value=L.d>0?L.d.toFixed(1):'';
  var hasL=g('rl-'+id)>0||g('wl-'+id)>0;
  var mv,lo,hi,av;
  if(hasL&&L.avg>0){mv=Math.min(S.avg,L.avg);lo=Math.min(S.lo,L.lo);hi=Math.max(S.hi,L.hi);av=(S.avg+L.avg)/2;}
  else{mv=S.avg;lo=S.lo;hi=S.hi;av=S.avg;}
  var fl=area*bcr,vl=fl*mv;
  var f1=function(n){return n>0?n.toFixed(1):'—';};
  var f0=function(n){return n>0?Math.round(n).toLocaleString():'—';};
  var u=function(s){return '<span class="mu">'+s+'</span>';};
  document.getElementById('rlo-'+id).innerHTML=f1(lo)+(lo>0?u('m'):'');
  document.getElementById('rhi-'+id).innerHTML=f1(hi)+(hi>0?u('m'):'');
  document.getElementById('rav-'+id).innerHTML=f1(av)+(av>0?u('m'):'');
  document.getElementById('rmv-'+id).innerHTML=f1(mv)+(mv>0?u('m'):'');
  document.getElementById('rfl-'+id).innerHTML=f1(fl)+(fl>0?u('㎡'):'');
  document.getElementById('rvl-'+id).innerHTML=f0(vl)+(vl>0?u('㎡'):'');
  upd();
}
function upd(){
  var tF=0,tV=0,ok=false;
  var tb=document.getElementById('stbl');tb.innerHTML='';
  blocks.forEach(function(id){
    var area=g('area-'+id),bcr=g('bcr-'+id)/100,rear=g('rear-'+id);
    var S=side(g('rs-'+id),g('fs-'+id),g('ws-'+id),rear);
    var L=side(g('rl-'+id),g('fl-'+id),g('wl-'+id),rear);
    var hasL=g('rl-'+id)>0||g('wl-'+id)>0;
    var mv=(hasL&&L.avg>0)?Math.min(S.avg,L.avg):S.avg;
    var lo=(hasL&&L.avg>0)?Math.min(S.lo,L.lo):S.lo;
    var hi=(hasL&&L.avg>0)?Math.max(S.hi,L.hi):S.hi;
    var av=(hasL&&L.avg>0)?(S.avg+L.avg)/2:S.avg;
    var fl=area*bcr,vl=fl*mv;
    var nm=document.getElementById('nm-'+id),zs=document.getElementById('zs-'+id);
    var name=(nm&&nm.value)||('구역 '+id);
    var zone=zs&&ZN[zs.value]||'—';
    var f1=function(n){return n>0?n.toFixed(1):'—';};
    var f0=function(n){return n>0?Math.round(n).toLocaleString():'—';};
    var tr=document.createElement('tr');tr.id='tr-'+id;
    if(aid===id)tr.classList.add('ar');
    tr.innerHTML='<td class="tn">'+String(id).padStart(2,'0')+'</td>'
      +'<td class="tn">'+name+'</td>'
      +'<td>'+(area>0?area.toLocaleString():'—')+'</td>'
      +'<td>'+zone+'</td>'
      +'<td>'+f1(lo)+'</td><td>'+f1(hi)+'</td><td>'+f1(av)+'</td>'
      +'<td class="th">'+f1(mv)+'</td>'
      +'<td>'+f1(fl)+'</td><td>'+f0(vl)+'</td>';
    tr.onclick=function(){setAct(id);};
    tb.appendChild(tr);
    if(area>0&&mv>0){tF+=fl;tV+=vl;ok=true;}
  });
  var avg=tF>0?tV/tF:0;
  document.getElementById('avgh').textContent=ok?avg.toFixed(1):'—';
  document.getElementById('sumv').textContent=ok?Math.round(tV).toLocaleString():'—';
}
addBlock();
</script>
