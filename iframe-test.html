<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>iframe 테스트</title></head>
<body style="margin:0;padding:20px;font-family:sans-serif;">
<h3 style="font-size:14px;margin-bottom:12px;">서울 도시계획 포털 iframe 테스트</h3>
<iframe src="https://urban.seoul.go.kr/view/map/main.html" 
  width="100%" height="500px" style="border:1px solid #ddd;border-radius:8px;"
  onerror="document.getElementById('msg').textContent='iframe 차단됨'">
</iframe>
<p id="msg" style="color:red;font-size:13px;margin-top:8px;"></p>
<script>
  var iframe = document.querySelector('iframe');
  iframe.onload = function() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      document.getElementById('msg').textContent = 'iframe 로드 성공!';
      document.getElementById('msg').style.color = 'green';
    } catch(e) {
      document.getElementById('msg').textContent = 'iframe 차단됨 (cross-origin): ' + e.message;
    }
  };
</script>
</body>
</html>
